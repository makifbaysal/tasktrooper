name: ci

on:
  push:
    branches: [main]
  pull_request:

# Build and test only read the repository.
permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: sudo apt-get install -y ripgrep
      - run: cd server && go build ./... && go vet ./...
      - run: cd server && go test ./...

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/runner/go.mod
          cache-dependency-path: desktop/runner/go.sum
      - run: cd desktop/runner && go build ./... && go vet ./...
      - run: cd desktop/runner && go test ./...

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - run: cd desktop/ui && npm ci
      - run: npm --prefix desktop/ui run typecheck
      - run: cd desktop/ui && npm run build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: cd desktop && npm ci
      - run: cd desktop && npm run typecheck
      - run: cd desktop && npm run lint
      - run: cd desktop && npm test
