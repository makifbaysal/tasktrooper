name: release

# A `v*` tag builds TaskTrooper for macOS, Windows and Linux, each on its own
# runner because the backend links C code (cgo), and publishes every installer
# plus the updater feeds (latest-mac.yml, latest.yml, latest-linux.yml) to that
# tag's GitHub Release, then points the Homebrew cask on main at the new dmg.
# Run it by hand to build all three without publishing: the installers are
# attached to the run as artifacts.
#
# The tag alone drives the version: each platform job writes the tag (minus
# its `v`) into desktop/package.json before building, so cutting a release is
# just pushing an annotated tag — no version-bump commit needed first, and
# nothing here writes that version back to the repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The platform jobs all upload into one release. Creating it once, first, is
  # what keeps them from racing to create three.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "TaskTrooper ${GITHUB_REF_NAME#v}" --generate-notes

  mac:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: macos-14
    timeout-minutes: 90
    # The Release environment holds the signing secrets and only admits v* tags.
    # A hand-started build binds no environment, so it gets no secrets and
    # produces an ad-hoc, unpublished app instead of being rejected outright.
    environment: ${{ github.ref_type == 'tag' && 'Release' || '' }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      CGO_ENABLED: "1"
      PUBLISH: ${{ github.ref_type == 'tag' && 'always' || 'never' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/ui/package-lock.json

      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Install and build
        run: |
          npm ci
          npm --prefix ui ci
          npm run build
          npm run build:ui
          npm run build:server:universal
          npm run build:embedder

      # @electron/notarize wants APPLE_API_KEY to be a *path* to the .p8 and the
      # secret holds base64 of it. `-c.mac.identity=-` is ad-hoc signing, not
      # "unsigned": an arm64 Mach-O with no signature at all cannot execute.
      - name: Work out the signing material
        id: sign
        working-directory: .
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_B64:-}" ]; then
            install -d -m 700 "$RUNNER_TEMP/asc"
            printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
            chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
            grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/AuthKey.p8" \
              || { echo "::error title=APPLE_API_KEY is not a base64 .p8::Re-run: base64 -i AuthKey_XXXX.p8 | pbcopy"; exit 1; }
            echo "apikey=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${CSC_LINK:-}" ]; then
            printf "args=\nsigned=true\n" >> "$GITHUB_OUTPUT"
            echo "Signed with the Developer ID certificate in CSC_LINK." >> "$GITHUB_STEP_SUMMARY"
          else
            printf "args=-c.mac.identity=-\nsigned=false\n" >> "$GITHUB_OUTPUT"
            echo "**Ad-hoc signed** (no CSC_LINK secret), so not notarized: the first launch needs right-click → Open, or \`xattr -dr com.apple.quarantine\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.sign.outputs.apikey }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          IDENTITY: ${{ steps.sign.outputs.args }}
        run: |
          # An absent secret arrives as an empty string, and electron-builder
          # reads an empty CSC_LINK as a certificate path: the working directory.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name:-}" ] || unset "$name"
          done
          npx electron-builder --mac --publish "$PUBLISH" \
            -c.publish.provider=github -c.publish.owner=makifbaysal -c.publish.repo=tasktrooper \
            -c.publish.releaseType=release ${IDENTITY:+"$IDENTITY"}

      # electron-builder reporting success is not evidence: the failure that
      # matters is an app refused on a user's Mac because one Mach-O in
      # Resources/bin was never signed.
      - name: Verify the artifact
        run: |
          set -euo pipefail
          app="release/mac-universal/TaskTrooper.app"
          [ -d "$app" ] || { echo "::error::$app was not produced"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          for f in Contents/Resources/bin/agent-server Contents/Resources/web/index.html Contents/Resources/embedder/index.cjs; do
            [ -e "$app/$f" ] || { echo "::error title=Missing from the bundle::$f"; exit 1; }
          done
          lipo -archs "$app/Contents/Resources/bin/agent-server"
          if [ "${{ steps.sign.outputs.signed }}" = "true" ] && [ -n "${{ steps.sign.outputs.apikey }}" ]; then
            xcrun stapler validate "$app"
            spctl --assess -t exec -vv "$app"
          fi
          echo "macOS: $(find release -maxdepth 1 \( -name '*.dmg' -o -name '*.zip' \) -print | sed 's#.*/##' | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip

  windows:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      CGO_ENABLED: "1"
      PUBLISH: ${{ github.ref_type == 'tag' && 'always' || 'never' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/ui/package-lock.json

      # cgo needs a C compiler, and the runner image does not put one on PATH.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Put gcc on PATH
        shell: pwsh
        working-directory: .
        run: '"${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Install and build
        run: |
          npm ci
          npm --prefix ui ci
          npm run build
          npm run build:ui
          npm run build:server
          npm run build:embedder

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --publish "$PUBLISH" \
            -c.publish.provider=github -c.publish.owner=makifbaysal -c.publish.repo=tasktrooper \
            -c.publish.releaseType=release

      - name: Verify the artifact
        run: |
          set -euo pipefail
          app="release/win-unpacked/resources"
          for f in bin/agent-server.exe web/index.html embedder/index.cjs; do
            [ -e "$app/$f" ] || { echo "::error title=Missing from the bundle::$f"; exit 1; }
          done
          ls release/*-setup.exe
          echo "Windows (unsigned): $(find release -maxdepth 1 -name '*-setup.exe' -print | sed 's#.*/##')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: windows
          path: desktop/release/*-setup.exe

  linux:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      CGO_ENABLED: "1"
      PUBLISH: ${{ github.ref_type == 'tag' && 'always' || 'never' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/ui/package-lock.json

      - name: Set the version from the tag
        if: github.ref_type == 'tag'
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Install and build
        run: |
          npm ci
          npm --prefix ui ci
          npm run build
          npm run build:ui
          npm run build:server
          npm run build:embedder

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --linux --publish "$PUBLISH" \
            -c.publish.provider=github -c.publish.owner=makifbaysal -c.publish.repo=tasktrooper \
            -c.publish.releaseType=release

      - name: Verify the artifact
        run: |
          set -euo pipefail
          app="release/linux-unpacked/resources"
          for f in bin/agent-server web/index.html embedder/index.cjs; do
            [ -e "$app/$f" ] || { echo "::error title=Missing from the bundle::$f"; exit 1; }
          done
          file "$app/bin/agent-server" | grep -q "ELF 64-bit"
          ls release/*.AppImage release/*.deb
          echo "Linux: $(find release -maxdepth 1 \( -name '*.AppImage' -o -name '*.deb' \) -print | sed 's#.*/##' | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb

  # This repository is its own Homebrew tap, so publishing the cask is a commit
  # to main. It has to hash the dmg the mac job actually uploaded, which is why
  # it runs after that job instead of alongside the build.
  cask:
    needs: mac
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && needs.mac.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point the cask at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/tasktrooper.rb)"
          # A re-run of an older tag must not roll the cask back past a newer release.
          if [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "Cask is already at $current, newer than $version; left alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          dmg="TaskTrooper-$version-universal.dmg"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "$dmg" --dir "$RUNNER_TEMP"
          scripts/update-cask.sh "$version" "$RUNNER_TEMP/$dmg"
          if git diff --quiet -- Casks/tasktrooper.rb; then
            echo "Cask already points at $version." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(cask): tasktrooper $version" -- Casks/tasktrooper.rb
          # main can move while the platforms build; rebase onto it and retry.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git pull --rebase origin main
          done
          [ "$pushed" = 1 ] || { echo "::error title=Cask not published::could not push Casks/tasktrooper.rb to main"; exit 1; }
          echo "Cask points at $version: $(grep -E '^  sha256 ' Casks/tasktrooper.rb)" >> "$GITHUB_STEP_SUMMARY"
