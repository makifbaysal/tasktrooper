name: system-architect
description: Owns technical analiz, spec/plan authoring, task decomposition, and the code_review gate
subagent_type: system-architect
effort: high
max_turns: 0
self_evolution: false
enabled: true
tool_policy:
    allow_tools:
        - run_terminal
        - write_file
        - edit_file
        - edit_lines
        - delete_file
        - move_file
        - download_file
        - web_search
        - fetch_url
        - codebase_search
        - grep_code
        - get_repo_tree
        - get_symbol_skeleton
        - expand_symbol_context
        - read_file
        - list_board_tasks
        - list_ready_tasks
        - move_board_task
        - update_board_task
        - add_task_comment
        - list_task_comments
        - list_task_documents
        - list_acceptance_criteria
        - set_criterion_completed
        - cancel_criterion
        - list_test_cases
        - list_projects
        - list_repositories
        - get_board_summary
        - list_team
        - create_board_task
        - add_task_document
        - update_task_document
        - attach_task_file
        - claim_board_task
        - get_pipeline_status
        - get_task_pull_request
        - comment_on_pull_request
        - save_memory
        - search_memory
        - delete_memory
        - load_skill
        - create_skill
        - record_project_note
        - get_project_brief
        - list_component_checks
        - list_links
        - get_environment
        - list_runtime_errors
    allow_mcp_servers: []
roles:
    - key: architect
      areas: []
    - key: analyst
      areas: []
subscriptions:
    - code_review
tech_stacks: []
kpis:
    - metric_key: tasks_completed
      name: Weekly tasks completed
      description: ""
      period: weekly
      target_full: 10
      target_half: 4
      weight: 1
      enabled: true
    - metric_key: revisions_received
      name: Weekly revisions
      description: ""
      period: weekly
      target_full: 1
      target_half: 3
      weight: 1
      enabled: true
    - metric_key: first_pass_rate
      name: First-pass rate
      description: ""
      period: weekly
      target_full: 90
      target_half: 75
      weight: 2
      enabled: true
    - metric_key: clean_time_code_review
      name: Clean review time
      description: ""
      period: weekly
      target_full: 0.5
      target_half: 2
      weight: 1
      enabled: true
    - metric_key: clean_time_in_progress
      name: Clean analysis time
      description: ""
      period: weekly
      target_full: 2
      target_half: 6
      weight: 1
      enabled: true
    - metric_key: review_escapes
      name: Weekly review escapes
      description: ""
      period: weekly
      target_full: 0
      target_half: 1
      weight: 2
      enabled: true
    - metric_key: gate_rejected_runs
      name: Gate-rejected runs
      description: ""
      period: weekly
      target_full: 0
      target_half: 2
      weight: 1.5
      enabled: true
    - metric_key: tool_error_rate
      name: Tool error rate
      description: ""
      period: weekly
      target_full: 3
      target_half: 6
      weight: 0.5
      enabled: true
