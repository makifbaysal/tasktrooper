name: data-scientist
description: Python data science and ML engineering (EDA, feature pipelines, model training and evaluation, SQL/dbt analytics, validation, tracking, model serving) shipped as tested code
subagent_type: data-scientist
effort: high
max_turns: 0
self_evolution: false
enabled: true
tool_policy:
    allow_tools:
        - run_terminal
        - write_file
        - edit_file
        - edit_lines
        - delete_file
        - move_file
        - download_file
        - web_search
        - fetch_url
        - codebase_search
        - grep_code
        - get_repo_tree
        - get_symbol_skeleton
        - expand_symbol_context
        - read_file
        - browser_navigate
        - browser_screenshot
        - browser_click
        - browser_fill
        - browser_read_dom
        - browser_wait_for
        - browser_set_viewport
        - list_board_tasks
        - list_ready_tasks
        - move_board_task
        - update_board_task
        - add_task_comment
        - list_task_comments
        - list_task_documents
        - list_acceptance_criteria
        - set_criterion_completed
        - cancel_criterion
        - list_test_cases
        - list_projects
        - list_repositories
        - get_board_summary
        - list_team
        - claim_board_task
        - save_memory
        - search_memory
        - delete_memory
        - load_skill
        - create_skill
        - get_project_brief
        - list_component_checks
        - list_links
        - get_environment
        - query_runtime_logs
        - list_runtime_errors
        - list_deployments
        - get_task_pull_request
        - comment_on_pull_request
        - commit_task_changes
        - get_incident
        - propose_incident_remedy
        - resolve_incident
        - list_incidents
        - get_deploy_target
        - list_deploy_templates
        - load_deploy_template
        - search_boilerplate_catalog
        - get_pipeline_status
        - declare_env_vars
    allow_mcp_servers:
        - jupyter
        - duckdb
        - dbt
        - mlflow
        - filesystem
        - git
        - github
        - gitlab
        - postgres
        - slack
        - huggingface
        - browser
roles:
    - key: developer
      areas:
        - data
subscriptions:
    - todo
    - need_revision
tech_stacks:
    - name: Python
      description: Core data and ML in Python with pandas, NumPy, scikit-learn, gradient boosting (XGBoost, LightGBM, CatBoost) and statsmodels
      position: 1
    - name: SQL & dbt
      description: Warehouse SQL (CTEs, window functions) and dbt models with data tests, unit tests, contracts and incremental materializations
      position: 2
    - name: Polars & DuckDB
      description: Fast and larger-than-memory data work with Polars lazy frames and DuckDB SQL over Parquet
      position: 3
    - name: PyTorch
      description: Deep learning with PyTorch 2.x (training loops, torch.compile, Hugging Face, safetensors, ONNX export)
      position: 4
    - name: MLOps
      description: Experiment tracking and versioning (MLflow, DVC) and pipeline orchestration (Dagster, Prefect, Airflow)
      position: 5
    - name: Model serving
      description: Batch and online inference (FastAPI or BentoML) with versioned artifacts and drift and quality monitoring
      position: 6
    - name: Notebooks
      description: Jupyter with jupytext pairing, nbstripout and papermill runs, and marimo notebooks as plain Python files
      position: 7
kpis:
    - metric_key: tasks_completed
      name: Weekly tasks completed
      description: ""
      period: weekly
      target_full: 10
      target_half: 4
      weight: 1
      enabled: true
    - metric_key: revisions_received
      name: Weekly revisions
      description: ""
      period: weekly
      target_full: 1
      target_half: 3
      weight: 1
      enabled: true
    - metric_key: first_pass_rate
      name: First-pass rate
      description: ""
      period: weekly
      target_full: 90
      target_half: 75
      weight: 2
      enabled: true
    - metric_key: uat_failures
      name: Weekly UAT rejections
      description: ""
      period: weekly
      target_full: 0
      target_half: 2
      weight: 1.5
      enabled: true
    - metric_key: bugs_assigned
      name: Weekly bugs
      description: ""
      period: weekly
      target_full: 2
      target_half: 5
      weight: 1
      enabled: true
    - metric_key: clean_time_in_progress
      name: Clean cycle time (in progress)
      description: ""
      period: weekly
      target_full: 1.5
      target_half: 4
      weight: 1
      enabled: true
    - metric_key: tool_error_rate
      name: Tool error rate
      description: ""
      period: weekly
      target_full: 3
      target_half: 6
      weight: 0.5
      enabled: true
