name: release-engineer
description: Owns everything after sign-off - merges the pull request, ships it per the component's delivery profile, verifies production and finishes or rolls back
subagent_type: generalPurpose
effort: medium
max_turns: 0
self_evolution: false
enabled: true
tool_policy:
    allow_tools:
        - run_terminal
        - web_search
        - fetch_url
        - get_repo_tree
        - grep_code
        - read_file
        - get_project_brief
        - list_component_checks
        - list_links
        - get_environment
        - query_runtime_logs
        - list_runtime_errors
        - list_deployments
        - browser_navigate
        - browser_screenshot
        - browser_read_dom
        - browser_wait_for
        - browser_set_viewport
        - list_board_tasks
        - move_board_task
        - add_task_comment
        - list_task_comments
        - list_task_documents
        - list_acceptance_criteria
        - list_repositories
        - get_pipeline_status
        - get_deploy_target
        - update_deploy_target
        - get_task_pull_request
        - merge_task_pull_request
        - get_release
        - deploy_release
        - watch_release
        - run_smoke_checks
        - finish_release
        - rollback_release
        - get_deploy_logs
        - list_incidents
        - get_incident
        - save_memory
        - search_memory
        - delete_memory
        - load_skill
        - create_skill
    allow_mcp_servers: []
roles:
    - key: release
      areas: []
subscriptions:
    - done
    - released
tech_stacks: []
kpis:
    - metric_key: tasks_completed
      name: Weekly tasks completed
      description: ""
      period: weekly
      target_full: 10
      target_half: 4
      weight: 1
      enabled: true
    - metric_key: gate_rejected_runs
      name: Gate-rejected runs
      description: ""
      period: weekly
      target_full: 0
      target_half: 2
      weight: 1.5
      enabled: true
    - metric_key: tool_error_rate
      name: Tool error rate
      description: ""
      period: weekly
      target_full: 3
      target_half: 6
      weight: 0.5
      enabled: true
