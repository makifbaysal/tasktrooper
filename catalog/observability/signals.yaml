# The fixed signal catalog: vendor-neutral measures a recipe maps onto one
# source kind's native queries. Loaded by server/internal/application/datasource.
signals:
  - {id: http.requests, kind: metric, unit: req/s, roles: [backend], aggregation: rate}
  - {id: http.error_ratio, kind: metric, unit: "%", roles: [backend], aggregation: ratio}
  - {id: http.latency, kind: metric, unit: ms, roles: [backend], aggregation: quantile}
  - {id: infra.cpu, kind: metric, unit: cores, roles: [backend, worker], aggregation: rate}
  - {id: infra.memory, kind: metric, unit: bytes, roles: [backend, worker], aggregation: gauge}
  - {id: infra.instances, kind: metric, unit: count, roles: [backend, worker], aggregation: gauge}
  - {id: infra.restarts, kind: metric, unit: restarts, roles: [backend, worker], aggregation: gauge}
  - {id: infra.throttles, kind: metric, unit: req/s, roles: [backend, worker], aggregation: rate}

  - {id: queue.backlog, kind: metric, unit: messages, roles: [worker], aggregation: gauge}
  - {id: queue.backlog_age, kind: metric, unit: s, roles: [worker], aggregation: gauge}
  - {id: queue.consume_rate, kind: metric, unit: msg/s, roles: [worker], aggregation: rate}
  - {id: queue.publish_rate, kind: metric, unit: msg/s, roles: [worker], aggregation: rate}
  - {id: queue.dead_letter, kind: metric, unit: messages, roles: [worker], aggregation: gauge}
  - {id: queue.consumers, kind: metric, unit: count, roles: [worker], aggregation: gauge}
  - {id: process.errors, kind: metric, unit: errors/s, roles: [worker], aggregation: rate}

  - {id: web.page_views, kind: metric, unit: views/s, roles: [frontend], aggregation: rate}
  - {id: web.sessions, kind: metric, unit: count, roles: [frontend], aggregation: gauge}
  - {id: web.lcp, kind: metric, unit: ms, roles: [frontend], aggregation: quantile}
  - {id: web.inp, kind: metric, unit: ms, roles: [frontend], aggregation: quantile}
  - {id: web.cls, kind: metric, unit: score, roles: [frontend], aggregation: quantile}
  - {id: web.ttfb, kind: metric, unit: ms, roles: [frontend], aggregation: quantile}
  - {id: web.js_errors, kind: metric, unit: errors/s, roles: [frontend], aggregation: rate}

  - {id: mobile.crash_free_users, kind: metric, unit: "%", roles: [mobile], aggregation: ratio}
  - {id: mobile.crash_rate, kind: metric, unit: "%", roles: [mobile], aggregation: ratio}
  - {id: mobile.anr_rate, kind: metric, unit: "%", roles: [mobile], aggregation: ratio}
  - {id: mobile.cold_start, kind: metric, unit: ms, roles: [mobile], aggregation: quantile}
  - {id: mobile.rollout_fraction, kind: metric, unit: "%", roles: [mobile], aggregation: gauge}
