# A Vercel project's traffic from Vercel Web Analytics, read with a connected
# Vercel account (the vercel kind). A bound Vercel project fills the project
# param with its id. Web Analytics must be switched on for the project; the
# hobby plan reads the last 7 days. Series are hourly below a one-day step,
# else daily (UTC). page_views is per second; visitors is a count per
# interval. Vercel has no session count. Tables cover the last 7 days, the
# most visited first; devices are grouped by device type.
id: vercel-web
source_kind: vercel
applies_to:
  technology: vercel
  resource_kind: vercel_project
  resource_params: {project: id}
detect:
  metric: pageview
params: [project]
signals:
  web.page_views: '{"metric": "page_views", "project": "$project"}'
  web.visitors: '{"metric": "visitors", "project": "$project"}'
tables:
  pages:
    key_labels: [path]
    columns:
      - {key: path, label: Path}
      - {key: views, label: Views, unit: views}
      - {key: visitors, label: Visitors, unit: visitors}
    query: '{"table": "pages", "project": "$project"}'
  referrers:
    key_labels: [referrer]
    columns:
      - {key: referrer, label: Source}
      - {key: views, label: Views, unit: views}
      - {key: visitors, label: Visitors, unit: visitors}
    query: '{"table": "referrers", "project": "$project"}'
  countries:
    key_labels: [country]
    columns:
      - {key: country, label: Country}
      - {key: views, label: Views, unit: views}
      - {key: visitors, label: Visitors, unit: visitors}
    query: '{"table": "countries", "project": "$project"}'
  devices:
    key_labels: [device]
    columns:
      - {key: device, label: Device}
      - {key: views, label: Views, unit: views}
      - {key: visitors, label: Visitors, unit: visitors}
    query: '{"table": "devices", "project": "$project"}'
