# A web frontend's traffic from Plausible (the plausible kind, Stats API v2).
# No params: the source's site is read; a site serving several hostnames is
# narrowed with a binding query of its own ({"metric": "page_views", "host":
# "app.example.com"}). Series are hourly below a one-day step, else daily, in
# the site's reporting time zone. page_views (pageviews) is per second;
# sessions (visits) and visitors are counts per interval. Tables cover the
# last 7 days, the most visited first; referrers are visit sources.
id: plausible-web
source_kind: plausible
applies_to:
  technology: plausible
detect:
  metric: pageview
signals:
  web.page_views: '{"metric": "page_views"}'
  web.sessions: '{"metric": "sessions"}'
  web.visitors: '{"metric": "visitors"}'
tables:
  pages:
    key_labels: [path]
    columns:
      - {key: path, label: Path}
      - {key: views, label: Views, unit: views}
      - {key: visitors, label: Visitors, unit: visitors}
    query: '{"table": "pages"}'
  referrers:
    key_labels: [referrer]
    columns:
      - {key: referrer, label: Source}
      - {key: views, label: Views, unit: views}
      - {key: visitors, label: Visitors, unit: visitors}
    query: '{"table": "referrers"}'
  countries:
    key_labels: [country]
    columns:
      - {key: country, label: Country}
      - {key: views, label: Views, unit: views}
      - {key: visitors, label: Visitors, unit: visitors}
    query: '{"table": "countries"}'
  devices:
    key_labels: [device, browser, os]
    columns:
      - {key: device, label: Device}
      - {key: browser, label: Browser}
      - {key: os, label: OS}
      - {key: views, label: Views, unit: views}
      - {key: visitors, label: Visitors, unit: visitors}
    query: '{"table": "devices"}'
