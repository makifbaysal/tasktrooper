# OpenTelemetry HTTP server semantic conventions, exported to Prometheus
# (http.server.request.duration as a seconds histogram).
id: otel-http
source_kind: prometheus
applies_to:
  technology: opentelemetry
detect:
  metric: http_server_request_duration_seconds_count
params: [job]
signals:
  http.requests: >-
    sum(rate(http_server_request_duration_seconds_count{job="$job"}[$__rate]))
  http.error_ratio: >-
    100 * (sum(rate(http_server_request_duration_seconds_count{job="$job", http_response_status_code=~"5.."}[$__rate])) or vector(0))
    / sum(rate(http_server_request_duration_seconds_count{job="$job"}[$__rate]))
  http.latency: >-
    1000 * histogram_quantile($__quantile, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="$job"}[$__rate])))
