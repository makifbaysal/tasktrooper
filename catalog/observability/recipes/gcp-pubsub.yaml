# A Pub/Sub subscription, from Google Cloud Monitoring's built-in
# pubsub.googleapis.com metrics (the pubsub_subscription resource).
# subscription is the subscription id (the last part of its name).
# queue.dead_letter is how many messages were forwarded to the dead-letter
# topic in each step.
id: gcp-pubsub
source_kind: gcp_monitoring
applies_to:
  technology: pubsub
  messaging_system: pubsub
detect:
  metric: pubsub_googleapis_com:subscription_num_undelivered_messages
params: [subscription]
signals:
  queue.backlog: >-
    sum(pubsub_googleapis_com:subscription_num_undelivered_messages{monitored_resource="pubsub_subscription", subscription_id="$subscription"})
  queue.backlog_age: >-
    max(pubsub_googleapis_com:subscription_oldest_unacked_message_age{monitored_resource="pubsub_subscription", subscription_id="$subscription"})
  queue.consume_rate: >-
    sum(rate(pubsub_googleapis_com:subscription_ack_message_count{monitored_resource="pubsub_subscription", subscription_id="$subscription"}[$__rate]))
  queue.dead_letter: >-
    sum(increase(pubsub_googleapis_com:subscription_dead_letter_message_count{monitored_resource="pubsub_subscription", subscription_id="$subscription"}[$__interval]))
