    DataSourceField:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        help:
          type: string
        type:
          type: string
          enum: [text, url, secret, select, headers, cloud_account, store_credential]
          description: >-
            cloud_account takes the id of a connected cloud account of the
            field's provider; store_credential takes the provider of the
            workspace's store credential to read (there is one per provider,
            saved under Settings → Integrations; app_store_connect is accepted
            for asc). Either way the kind reads that credential when it calls,
            so the source stores none.
        provider:
          type: string
          enum: [gcp, aws, vercel, google_play, asc]
          description: >-
            Only on a cloud_account field (the provider its account must be:
            gcp, aws, vercel) or a store_credential field (the store
            credential it names: google_play, asc).
        default:
          type: string
          description: >-
            The value a shown field takes when none is given (a
            store_credential field's provider, Sentry's https://sentry.io);
            absent when the field has none.
        required:
          type: boolean
          description: Applies only while the field is shown.
        options:
          type: array
          items:
            type: string
        placeholder:
          type: string
        show_when:
          type: object
          description: The field is shown only while every named field holds the given value.
          additionalProperties:
            type: string
        secret:
          type: boolean
          description: Send it in secrets; it never comes back, only its key in secrets_set.
        destination:
          type: boolean
          description: >-
            Present (true) on a text field holding the host[:port] list a kind connects to
            (Kafka's bootstrap_servers): judged by the URL policy at save, and moving it
            re-asks for the stored secrets.
        multiline:
          type: boolean
          description: >-
            Present (true) on a field whose value spans lines (a PEM certificate, a key
            file's JSON): give it a text area.
