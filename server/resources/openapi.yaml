          items:
            type: string
        aggregation:
          type: string
          enum: [rate, ratio, quantile, gauge]
        better:
          type: string
          enum: [higher, lower]
          description: Which way the signal moves when things improve; absent, it is not judged across a deploy.
    DeployImpact:
      type: object
      required: [release_id, component_id, environment, deployed_at, window_minutes, pending, verdict, computed_at, signals]
      properties:
        release_id:
          type: string
          format: uuid
        component_id:
          type: string
          format: uuid
          nullable: true
        environment:
          type: string
          enum: [production]
        deployed_at:
          type: string
          format: date-time
          nullable: true
        window_minutes:
          type: integer
        pending:
          type: boolean
        verdict:
          $ref: '#/components/schemas/ImpactVerdict'
        computed_at:
          type: string
          format: date-time
        signals:
          type: array
          items:
            $ref: '#/components/schemas/SignalImpact'
    SignalImpact:
      type: object
      required: [signal, unit, before, after, after_points, baseline, delta, delta_pct, higher_is_better, verdict]
      properties:
        signal:
          type: string
        unit:
          type: string
        before:
          type: number
          nullable: true
        after:
          type: number
          nullable: true
        after_points:
          type: integer
          description: How many samples after averaged; a soak holds a threshold only from 5 on.
        baseline:
          type: number
          nullable: true
        delta:
          type: number
          nullable: true
          description: after - before, in the signal's unit (percentage points for a ratio).
        delta_pct:
          type: number
          nullable: true
          description: delta as a percent of before; null when before is 0.
        higher_is_better:
          type: boolean
        verdict:
          $ref: '#/components/schemas/ImpactVerdict'
    ImpactVerdict:
      type: string
      enum: [improved, neutral, worse, unknown]
    Recipe:
      type: object
      properties:
        id:
          type: string
        source_kind:
          type: string
        applies_to:
          type: object
          properties:
            technology:
              type: string
            messaging_system:
              type: string
            resource_kind:
              type: string
              description: >-
                The cloud resource kind (cloud_run_service, gke_workload,
                ecs_service, lambda_function, …) an environment must be bound
                to for the recipe to fit it; empty when none.
            resource_params:
              type: object
              description: >-
                Param to the field of that resource's ref that fills it: id,
                name, region or extra.<key>.
              additionalProperties:
                type: string
            store_platform:
              type: string
              enum: ['', ios, android]
              description: >-
                The store app a mobile component's repository must have linked
                for the recipe to fit it; empty when none.
            store_params:
              type: object
              description: >-
                Param to the field of that store app that fills it:
                identifier (bundle id / package name) or store_app_id (App
                Store Connect's app id).
              additionalProperties:
                type: string
        detect:
          type: object
          properties:
            metric:
              type: string
        params:
          type: array
          items:
            type: string
        defaults:
          type: object
          description: >-
            The value a declared param takes where a binding leaves it empty
            (datadog-apm's metric_prefix); absent when none.
          additionalProperties:
            type: string
        signals:
          type: object
          description: >-
            Signal id to native query in the source kind's language; $param,
            $__rate, $__interval and $__quantile are placeholders.
          additionalProperties:
            type: string
        tables:
          type: object
          description: >-
            Per-entity tables the recipe reads at an instant, by name: queues
            (the queues view), crashes (one row per crash or error issue:
            issue, type, cause, location, users, reports, last_version,
            last_seen, link) and signatures (one row per diagnostic
            signature: issue, type, cause, weight, build) for the crashes
            view, pages, referrers, countries and devices (one row per path,
            source, country or device: views, visitors, …) for the web view,
            and endpoints (one row per route or transaction: rpm, error_pct,
            p95_ms) for the endpoints view. Absent when the recipe has none.
          additionalProperties:
            $ref: '#/components/schemas/RecipeTable'
        origin:
          type: string
          enum: [catalog, user]
    RecipeTable:
      type: object
      description: >-
        A key_labels column is filled from that label of each result row and
        identifies the row; every other column is the value its own query in
        queries answers (the file may write query for a table with one value
        column, or for a crashes, signatures, web or endpoints table one
        query for every column, its kind answering them by name). Rows of all queries are
        joined on the key labels' values.
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/TableColumn'
        key_labels:
          type: array
          items:
            type: string
        queries:
          type: object
          additionalProperties:
            type: string
    TableColumn:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        unit:
          type: string
    QueueTable:
      type: object
      properties:
        signal_binding_id:
          type: string
          format: uuid
          description: The first binding, in catalog order, of those reading this table.
