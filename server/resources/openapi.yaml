openapi: 3.0.3
info:
  title: Local LLM Bridge API
  version: 1.0.0
  description: OpenAI-compatible bridge with agent loop, tools, sessions, jobs, and RAG.

paths:
  /v1/chat/completions:
    post:
      summary: Chat completions with agent loop
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                stream:
                  type: boolean
                session_id:
                  type: string
                tool_policy:
                  $ref: '#/components/schemas/ToolPolicy'
                file_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Completion response

  /v1/sessions:
    post:
      summary: Create session
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Session created

  /v1/sessions/{id}:
    get:
      summary: Get session with messages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      summary: Delete session
      security:
        - bearerAuth: []

  /v1/sessions/{id}/messages:
    post:
      summary: Send message to session
      security:
        - bearerAuth: []

  /v1/sessions/{id}/cancel:
    post:
      summary: Stop the agent turn this session has in flight
      description: >-
        Returns {"cancelled": true} when a live turn was stopped and
        {"cancelled": false} when there was nothing left to stop (the answer
        landed first) — the latter is a normal outcome, not an error.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

  /v1/repositories/{id}/tasks/{taskId}/chat:
    post:
      summary: Open the chat thread about one board task
      description: >-
        Returns the session a human talks to an agent about this task in, plus
        the agent answering there. Idempotent — a task keeps one thread for its
        whole life, so this returns the existing session when there is one (and
        adopts the task's clarification thread rather than opening a second
        chat). The thread runs in the task's own branch checkout, not the shared
        mirror clone, so the agent can commit and push into the task's pull
        request. agent_id is "" when the task has no assignee and nobody is
        subscribed to its column. 404 for an unknown repository or a task that
        repository does not own; 503 on a build with no board.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The task's chat session
          content:
            application/json:
              schema:
                type: object
                required: [session_id, agent_id]
                properties:
                  session_id:
                    type: string
                    format: uuid
                  agent_id:
                    type: string
                    description: Agent uuid, or "" when the chat has no agent persona.

  /v1/jobs:
    post:
      summary: Create async job
      security:
        - bearerAuth: []

  /v1/jobs/{id}:
    get:
      summary: Get job status
      security:
        - bearerAuth: []
    delete:
      summary: Cancel or delete job
      security:
        - bearerAuth: []

  /v1/jobs/{id}/result:
    get:
      summary: Get completed job result
      security:
        - bearerAuth: []

  /v1/files:
    get:
      summary: List uploaded files
      security:
        - bearerAuth: []
    post:
      summary: Upload file for RAG
      security:
        - bearerAuth: []

  /v1/audit:
    get:
      summary: List audit log entries
      security:
        - bearerAuth: []

  /v1/tools/health:
    get:
      summary: MCP server health
      security:
        - bearerAuth: []

  /v1/repositories/{id}/alert-tokens:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create an alert ingest token for the repository
      description: >-
        The plaintext token is in this response only; the server keeps its
        sha256. default_env (local, stage, preprod or prod; prod when omitted)
        is the incident environment when neither the payload nor ?env= names one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  maxLength: 100
                default_env:
                  type: string
                  enum: [local, stage, preprod, prod]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AlertIngestToken'
                  - type: object
                    properties:
                      token:
                        type: string
                      ingest_path:
                        type: string
                        example: /v1/alerts/ingest/tt_alert_…
        '400':
          description: Missing or over-long label, or an unknown default_env
        '404':
          description: No such repository
        '503':
          description: Alert tokens are not available on this server
    get:
      summary: List the repository's alert ingest tokens (never the token itself)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tokens, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertIngestToken'
        '503':
          description: Alert tokens are not available on this server

  /v1/repositories/{id}/alert-tokens/{tokenId}:
    delete:
      summary: Revoke one of the repository's alert ingest tokens
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked
        '404':
          description: No such token on this repository
        '503':
          description: Alert tokens are not available on this server

  /v1/alerts/ingest/{token}:
    post:
      summary: Ingest an alert with an alert ingest token instead of the API key
      description: >-
        The same normalization and ingest as POST /v1/repositories/{id}/incidents
        (Alertmanager, Sentry, GCP Cloud Monitoring, generic JSON), for the
        token's repository. A Content-Length (or a chunked body) over 256 KiB is
        refused. An unknown token is a bare 404. Each token has a request rate
        (prod_ops.alert_ingest.requests_per_minute, burst) and a cap on NEW
        incidents per rolling hour (new_incidents_per_hour); an alert that folds
        into an incident already open, and a recovery, are not refused by the
        cap.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: env
          in: query
          required: false
          description: Environment when the payload names none; overrides the token's default_env.
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident_id:
                    type: string
                    format: uuid
        '202':
          description: A recovery for an incident that is not open; nothing changed
        '400':
          description: The body is not JSON
        '404':
          description: Unknown token
        '413':
          description: Body over 256 KiB
        '429':
          description: The token is over its request rate, or over its hourly cap on new incidents
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [rate_limited]

  /v1/store/credentials/{provider}/apps:
    get:
      summary: List apps a saved store credential can see
      description: >-
        Picker source. Answers 200 with listing_available:false (never a
        5xx) when the store cannot enumerate apps for this credential — the
        Play Developer API has no listing endpoint at all, and a service
        account may not reach the separate Reporting API that does.
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [asc, google_play]
      responses:
        '200':
          description: App listing
          content:
            application/json:
              schema:
                type: object
                required: [listing_available, apps]
                properties:
                  listing_available:
                    type: boolean
                  apps:
                    type: array
                    items:
                      type: object
                      properties:
                        store_app_id:
                          type: string
                        identifier:
                          type: string
                        name:
                          type: string
                        state:
                          type: string

  /v1/repositories/{id}/store/apps/{platform}/link:
    put:
      summary: Bind a repository/platform to one store app
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [ios, android]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                store_app_id:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: The updated mobile store app row

  /v1/repositories/{id}/store/apps/{platform}/tracks:
    get:
      summary: Read the three store channels live
      description: >-
        Refreshes the app row's tracks cache with what App Store Connect /
        Google Play report right now for the internal, external and
        production channels.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [ios, android]
      responses:
        '200':
          description: StoreTracks

  /v1/repositories/{id}/store/apps/{platform}/promote:
    post:
      summary: Promote a store release one channel forward
      description: >-
        internal -> external -> production only, one step at a time.
        to=production requires a matching confirm phrase. 409 when the app
        is not yet ready for the move. Android into production takes
        user_fraction, the staged rollout's share in (0, 1] (left out: 1,
        everyone; 400 outside the range); App Store and the testing channels
        ignore it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [ios, android]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
                confirm:
                  type: string
                user_fraction:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 1

  /v1/repositories/{id}/store/apps/android/rollout:
    post:
      summary: Change a Google Play production staged rollout
      description: >-
        user_fraction must be in (0, 1] — Play reads 0 as a completed
        release, so 0 is refused like anything outside the range (400).
        1 completes the rollout and requires confirm to match the
        repository's name (400 otherwise). 409 before the app is live.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_fraction]
              properties:
                user_fraction:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 1
                confirm:
                  type: string
      responses:
        '204':
          description: The rollout share was changed

  /v1/repositories/{id}/store/apps/{platform}/build:
    post:
      summary: Start a mobile store release build
      description: >-
        engine defaults to the repository's release_engine ("auto" = GitHub
        Actions, falling back to the paired machine). 409 when no engine can run
        it (domain.ErrNoReleaseEngine) — the task card is parked on
        human_decision rather than retried.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [ios, android]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                engine:
                  type: string
                  enum: [auto, github_actions, local]
      responses:
        '200':
          description: BuildStart
        '409':
          description: No release engine available

  /v1/roles:
    get:
      summary: List roles with their agent assignments and purposes
      security:
        - bearerAuth: []
    post:
      summary: Create a role
      description: key is immutable once created.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key:
                  type: string
                name:
                  type: string
                description:
                  type: string
                required_tools:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: The created role

  /v1/roles/{id}:
    put:
      summary: Update a role's name/description/required_tools (key unchanged)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      summary: Delete a role
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /v1/roles/{id}/assignments:
    put:
      summary: Replace a role's agent assignments
      description: >-
        assignments: [{agent_id, areas, priority}]. When an assignment names
        an agent missing the role's required_tools, the request is refused
        with 422 {saved:false, missing_tools} unless confirm_grant_tools is
        set, in which case the missing tools are granted to that agent's
        policy and 200 {saved:true, role, granted_tools} is returned.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      agent_id:
                        type: string
                      areas:
                        type: array
                        items:
                          type: string
                        nullable: true
                      priority:
                        type: integer
                confirm_grant_tools:
                  type: boolean
      responses:
        '200':
          description: Saved
        '422':
          description: Missing required tools on one or more assigned agents

  /v1/agents/{agentId}/roles:
    get:
      summary: List the roles an agent holds
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
    put:
      summary: Replace every role membership this agent holds
      description: >-
        roles: [{role_id, areas}]. Same confirm_grant_tools/missing_tools
        contract as PUT /v1/roles/{id}/assignments, checked against the union
        of every named role's required_tools.
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved
        '422':
          description: Missing required tools

  /v1/role-purposes:
    get:
      summary: List the system-purpose to role mapping
      description: purposes = system_task_assignee, repo_profiler.
      security:
        - bearerAuth: []

  /v1/role-purposes/{purpose}:
    put:
      summary: Set (or clear, with role_id null) which role fulfils a purpose
      security:
        - bearerAuth: []
      parameters:
        - name: purpose
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_id:
                  type: string
                  nullable: true
      responses:
        '204':
          description: Saved

  /v1/task-types:
    get:
      summary: List task types
      security:
        - bearerAuth: []
    post:
      summary: Create a task type, optionally cloning another type's workflow stages
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, label, key_prefix]
              properties:
                key:
                  type: string
                label:
                  type: string
                key_prefix:
                  type: string
                  description: 1-4 uppercase letters, unique.
                clone_from:
                  type: string
      responses:
        '201':
          description: The created task type

  /v1/task-types/{key}:
    put:
      summary: Update a task type
      description: >-
        409 when key_prefix changes on a type that already has tasks (every
        existing task's key was rendered with the old prefix).
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The updated task type
        '409':
          description: key_prefix change refused (type has tasks)
    delete:
      summary: Delete a task type
      description: 409 when the type has tasks, or is the default type.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '409':
          description: Type has tasks, or is the default type

  /v1/task-types/{key}/workflow:
    get:
      summary: Read a task type's ordered workflow stages
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
    put:
      summary: Replace a task type's whole workflow stage set
      description: >-
        422 {error, problems:[{column_slug, field, message}]} on an unknown
        behaviour key, a behaviour attached at the wrong scope, an invalid
        param, or more than one worker/approver participant in a stage.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The saved stage set
        '422':
          description: Validation problems

  /v1/workflows:
    get:
      summary: List every task type's full workflow (stages + behaviours)
      security:
        - bearerAuth: []

  /v1/workflow/behaviours:
    get:
      summary: The behaviour registry — every key, its scope, and its params
      description: >-
        Drives the workflow stage editor's behaviour picker and its
        validation. Also returns the fixed stage kinds and repo areas.
      security:
        - bearerAuth: []

  /v1/agents/{agentId}/subscriptions:
    get:
      summary: An agent's column subscriptions, with each column's task-type filter
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
    put:
      summary: Replace an agent's column subscriptions
      description: >-
        Accepts subscriptions:[{column_slug, task_types}] (task_types null or
        omitted = every type); the legacy column_slugs:[...] body is still
        accepted and saves each column with no filter.
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Saved

  /v1/data-source-kinds:
    get:
      summary: Registered observability data source kinds and their config forms
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The kind registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataSourceKind'

  /v1/data-sources:
    get:
      summary: Configured data sources (never a secret value)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every data source
          content:
            application/json:
              schema:
                type: object
                properties:
                  data_sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataSource'
    post:
      summary: Add a data source, then verify it
      description: >-
        Saved first and verified after: 201 even when the source cannot be
        reached, with status error and status_detail saying why. A secret field
        sent in config is stored as a secret. An empty name defaults to the
        URL's host.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                name:
                  type: string
                config:
                  type: object
                  additionalProperties:
                    type: string
                secrets:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '201':
          description: Created; status reflects the verify run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400':
          description: The request does not fit the kind's schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceFieldErrors'

  /v1/data-sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: One data source
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '404':
          description: No such data source
    patch:
      summary: Change a data source, then verify it again
      description: >-
        A key given in config or secrets replaces its value and an empty string
        removes it; keys left out are kept. A field hidden by its show_when
        loses its value. Moving a url to another scheme, host or port needs
        every stored secret the result keeps re-sent in secrets (a new value,
        or "" to remove), else 400 with fields.secrets = secrets_required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                config:
                  type: object
                  additionalProperties:
                    type: string
                secrets:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Saved; status reflects the verify run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400':
          description: The result does not fit the kind's schema, or moves the URL without the secrets (secrets_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceFieldErrors'
        '404':
          description: No such data source
    delete:
      summary: Remove a data source
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Removed
        '404':
          description: No such data source

  /v1/data-sources/{id}/verify:
    post:
      summary: Verify a data source again
      description: Always 200 for a known source; a failure is reported through status and status_detail.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The data source with the new status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'

  /v1/data-sources/{id}/discover:
    get:
      summary: Metric names the source holds, and the recipes they suggest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: match
          in: query
          required: false
          description: Case-insensitive substring filter on metric names. Recipe detection ignores it.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 1000
            maximum: 5000
      responses:
        '200':
          description: The inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: array
                    items:
                      type: string
                  truncated:
                    type: boolean
                  recipes:
                    type: array
                    items:
                      type: object
                      properties:
                        recipe_id:
                          type: string
                        matched_metric:
                          type: string
        '422':
          description: The kind cannot list metrics (code unsupported)
        '502':
          description: The source failed (code upstream)

  /v1/data-sources/{id}/query:
    post:
      summary: Range query against a metrics data source
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, from, to]
              properties:
                query:
                  type: string
                  description: >-
                    In the kind's query language: PromQL for prometheus and
                    gcp_monitoring, CloudWatch query JSON for aws_cloudwatch
                    ({namespace, metric, stat, dimensions?, period?} or
                    {expression, metrics?: {id: metric}, period?}), and for
                    the direct broker kinds one JSON object: kafka {group,
                    topic?, metric?: lag|lag_by_partition|consumers|members},
                    rabbitmq {queue (a * matches any run of characters),
                    metric?: messages|ready|unacked|consumers|publish_rate|deliver_rate|ack_rate},
                    nats {stream, consumer?, metric?: pending|ack_pending|redelivered|waiting}
                    (an absent metric is the backlog: lag, messages,
                    pending), and for loki a LogQL metric query
                    (sum(rate({…} |= "error" [2m]))). A direct broker kind reads live state, so it
                    answers one point per series, at `to` (or now when `to`
                    is later); a window that ended more than 5 minutes ago
                    answers no series and a warning — chart history needs an
                    exporter-backed source.
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                step_seconds:
                  type: number
                  description: 0 or omitted picks a step giving about 600 points (at least 15 s).
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                type: object
                properties:
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                        points:
                          type: array
                          description: '[unix_ms, value] pairs; value is null where the source answered NaN or ±Inf.'
                          items:
                            type: array
                            minItems: 2
                            maxItems: 2
                            items:
                              type: number
                              nullable: true
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          description: Bad range or step (fields), or a query the source refused (code bad_query)
        '422':
          description: The kind cannot query metrics (code unsupported)
        '502':
          description: The source failed (code upstream)

  /v1/signals:
    get:
      summary: The vendor-neutral signal catalog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every signal
          content:
            application/json:
              schema:
                type: object
                properties:
                  signals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Signal'

  /v1/recipes:
    get:
      summary: Recipes mapping signals to native queries (catalog plus user-added)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every recipe
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'

  /v1/operations/errors:
    get:
      summary: Error groups across every component of one deploy environment
      description: >-
        Reads every confirmed, bound environment of the kind (at most 50; truncated
        says more matched), 4 at a time, each cut off after 20s. An environment whose
        provider has no error surface is skipped silently; one that fails is listed
        in unavailable and never fails the answer. The groups of every component's
        confirmed errors.issues binding on an errors-capable source (a Sentry
        project) join them, read beside the cloud environments the same way (at most
        50 bindings, at most 100 groups each): provider is the source's kind,
        data_source_id is set and environment_id is the zero UUID; a binding that
        fails is unavailable with its data_source_id. Sorted new first, then
        last_seen newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OpsEnvironment'
        - $ref: '#/components/parameters/OpsComponentID'
        - name: since
          in: query
          required: false
          description: RFC3339; default 24 hours ago, clamped to 30 days back.
          schema:
            type: string
            format: date-time
        - name: include_ignored
          in: query
          required: false
          description: 1 or true keeps the groups an ignore error definition matches.
          schema:
            type: string
      responses:
        '200':
          description: The merged error groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsErrorGroup'
                  unavailable:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsUnavailable'
                  truncated:
                    type: boolean
                  ignored_count:
                    type: integer
                    description: Groups an ignore definition left out; present only when non-zero.
        '400':
          description: Unknown env, malformed since or component_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatError'

  /v1/operations/logs:
    get:
      summary: Log entries across every component of one deploy environment
      description: >-
        Reads at most 10 confirmed, bound environments of the kind, 4 at a time,
        each cut off after 20s, with the same window and limit, and merges them
        newest first. More than 10 with no component_id is 400
        too_many_environments; with one, the first 10 are read and truncated is
        set. truncated is also set when an environment had more or the merge was
        cut. The next older page is the same query with until = the oldest
        timestamp returned (inclusive; de-duplicate entries at that instant).
        A component with a confirmed logs.lines binding in the environment is
        read through that binding (Loki, Elasticsearch) instead of its cloud
        environments; such a read counts toward the 10, and its entries and
        unavailable rows carry data_source_id and the zero environment_id.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OpsEnvironment'
        - $ref: '#/components/parameters/OpsComponentID'
        - name: since
          in: query
          required: false
          description: RFC3339; default an hour before until.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: RFC3339; default now.
          schema:
            type: string
            format: date-time
        - name: min_severity
          in: query
          required: false
          schema:
            type: string
            enum: [debug, info, warning, error, critical]
        - name: text
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Per environment and for the merge; default 200, max 500.
          schema:
            type: integer
      responses:
        '200':
          description: The merged entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsLogEntry'
                  unavailable:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsUnavailable'
                  truncated:
                    type: boolean
        '400':
          description: >-
            Bad input, or too_many_environments (code too_many_environments, with
            matched and max_environments): pick components.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatError'

  /v1/operations/golden:
    get:
      summary: Golden signal values for every component with a confirmed binding
      description: >-
        At most 200 active components (by name), each with its role's golden signals
        (catalog/observability/golden.yaml). from/to default to the last hour and are
        rounded down to the minute; at most 30 days. value is the window's last non-null
        sample (p95 for a quantile signal), previous the last non-null one a window
        earlier, spark about 30 points of the window. An unbound or failing signal
        answers nulls and an empty spark; bound tells the two apart. The whole read is
        bounded at 25s (a signal still unread answers nulls), and a source that timed
        out is not asked again within it. Cached 60s per env, window, component set and
        source/recipe version; any binding or source change drops the cache, and polls
        asking the same at once share one read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OpsEnvironment'
        - $ref: '#/components/parameters/OpsComponentID'
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The golden values
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type: string
                    format: date-time
                  components:
                    type: array
                    items:
                      type: object
                      properties:
                        component_id:
                          type: string
                          format: uuid
                        signals:
                          type: array
                          items:
                            type: object
                            properties:
                              signal:
                                type: string
                              unit:
                                type: string
                              bound:
                                type: boolean
                                description: The component has a confirmed binding for the signal in env.
                              live:
                                type: boolean
                                description: >-
                                  Present (true) when the bound source reads only the value now (a
                                  direct broker kind): the spark is one point.
                              value:
                                type: number
                                nullable: true
                              previous:
                                type: number
                                nullable: true
                              spark:
                                type: array
                                items:
                                  $ref: '#/components/schemas/SeriesPoint'
        '400':
          description: Unknown env, malformed from/to (fields) or component_id

  /v1/components/{id}/signals:
    get:
      summary: The component's signals with their bindings and suggestions in one environment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
        - $ref: '#/components/parameters/OpsEnvironment'
      responses:
        '200':
          description: The role's signals, then any other signal with a binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentSignals'
        '400':
          description: Unknown env or malformed id
        '404':
          description: Unknown component

  /v1/components/{id}/signals/suggest:
    post:
      summary: Run the binding detector, then answer as GET signals
      description: >-
        Offers recipes whose detect metric a source holds (params from the label
        values naming the component; on loki, elasticsearch and tempo the detect metric is a
        label, field or tag and its values are listed directly), for an environment bound to a cloud resource the
        recipes for that resource kind on sources linked to the same cloud account, and on
        a broker source (kafka, rabbitmq, nats) the consumers whose names best name the
        component, each with the kind's own queries. Once the component's brokers are
        known (the vendors of the queue resources its links reach), a worker is offered no
        recipe or broker source of another messaging system, and suggestions reading one of
        its brokers come first. Never touches a confirmed binding or re-offers a dismissed
        target.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
        - $ref: '#/components/parameters/OpsEnvironment'
      responses:
        '200':
          description: The signals after detection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentSignals'

  /v1/components/{id}/signals/preview:
    post:
      summary: Render and run a binding before it is saved
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SignalBindingRequest'
                - type: object
                  required: [signal]
                  properties:
                    signal:
                      type: string
                    from:
                      type: string
                      format: date-time
                    to:
                      type: string
                      format: date-time
                    step_seconds:
                      type: number
      responses:
        '200':
          description: The rendered query and its series
          content:
            application/json:
              schema:
                type: object
                properties:
                  rendered_query:
                    type: string
                  series:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetricSeries'
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          description: Field errors (fields), or a query the source refused (code bad_query)
        '422':
          description: The kind cannot query metrics (code unsupported)
        '502':
          description: The source failed (code upstream)

  /v1/components/{id}/signals/{signal}:
    put:
      summary: Bind a signal by hand (confirmed, source human)
      description: >-
        Replaces the confirmed binding of (component, env, signal) in place and drops that
        slot's pending suggestions. A raw query wins over a recipe when both are given.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
        - name: signal
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/OpsEnvironment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalBindingRequest'
      responses:
        '200':
          description: The confirmed binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalBinding'
        '400':
          description: Field errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceFieldErrors'
        '409':
          description: Another write to the same slot won (code conflict); read and retry

  /v1/components/{id}/series:
    get:
      summary: Time series of a component's bound signals
      description: >-
        to defaults to now, from to an hour before; step_seconds 0 or absent gives about
        120 points (at least 15s). A quantile signal whose query takes $__quantile answers
        p50, p75, p95 and p99 series. compare=1 fills previous with the window before, shifted
        onto this one; a previous window that fails carries previous_error and leaves
        series be. A signal that fails carries error and never fails the others. At most
        4 queries at once, 20s each, 30s for the whole read (a signal still unread answers
        timeout); a source that timed out is not asked again within it. step_seconds is
        the coarsest spacing a source answered at (CloudWatch rounds to whole minutes).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
        - $ref: '#/components/parameters/OpsEnvironment'
        - name: signals
          in: query
          required: false
          description: Comma-separated signal ids; absent means every metric signal of the role.
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: step_seconds
          in: query
          required: false
          schema:
            type: number
        - name: compare
          in: query
          required: false
          schema:
            type: string
            enum: ['1', 'true']
      responses:
        '200':
          description: One entry per signal
          content:
            application/json:
              schema:
                type: object
                properties:
                  from:
                    type: string
                    format: date-time
                  to:
                    type: string
                    format: date-time
                  step_seconds:
                    type: integer
                  signals:
                    type: array
                    items:
                      type: object
                      properties:
                        signal:
                          type: string
                        unit:
                          type: string
                        bound:
                          type: boolean
                        live:
                          type: boolean
                          description: >-
                            Present (true) when the bound source reads only the value now (a direct
                            broker kind): a series holds one point however long the window.
                        series:
                          type: array
                          items:
                            $ref: '#/components/schemas/MetricSeries'
                        previous:
                          type: array
                          items:
                            $ref: '#/components/schemas/MetricSeries'
                        error:
                          type: object
                          nullable: true
                          properties:
                            code:
                              type: string
                              enum: [unknown_signal, needs_params, unsupported, bad_query, upstream, timeout, not_found, error]
                            message:
                              type: string
                        previous_error:
                          type: object
                          nullable: true
                          description: The previous window's read failed (compare=1 only); same shape as error.
                          properties:
                            code:
                              type: string
                              enum: [unknown_signal, needs_params, unsupported, bad_query, upstream, timeout, not_found, error]
                            message:
                              type: string
        '400':
          description: Bad window or step (fields), or unknown env

  /v1/components/{id}/queues:
    get:
      summary: Per-queue tables of a component's confirmed queue bindings
      description: >-
        One table per distinct thing the component's confirmed queue.* bindings read in
        env, at the instant of the request. A binding whose recipe declares tables.queues
        reads that table with the params the table uses (two bindings agreeing on them
        share one table, named by the first in catalog order); a binding on a broker kind
        (a source with the queues capability) hands its own query to the kind, grouped by
        what it reads with its metric left out. Any other binding has no table. Each table stands alone: one that cannot be read carries
        error and no rows. At most 4 queries at once, 20s each, 20s for the whole read,
        shared by requests asking at once; answers are kept 30s per cache scope (read_at
        says when they were read).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
        - $ref: '#/components/parameters/OpsEnvironment'
      responses:
        '200':
          description: The component's queue tables
          content:
            application/json:
              schema:
                type: object
                properties:
                  component_id:
                    type: string
                    format: uuid
                  environment:
                    type: string
                  read_at:
                    type: string
                    format: date-time
                    description: When the tables were read; a cached answer is older than the request.
                  queues:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueueTable'
        '400':
          description: Unknown env
        '404':
          description: Unknown component

  /v1/components/{id}/endpoints:
    get:
      summary: The backend endpoints tables of a component's confirmed http bindings
      description: >-
        For each confirmed http.* binding in env whose recipe declares tables.endpoints
        (otel-http, datadog-apm, newrelic-apm), that table read with the params it uses
        (a recipe default fills one the binding leaves empty): one row per route or
        transaction, its key column the source's own label (http_route, resource_name,
        facet), then rpm (requests per minute), error_pct and p95_ms. Two bindings
        agreeing on the table's params share one table, named by the first in catalog
        order; a binding with a raw query has none. Rows are the busiest first. Each
        table stands alone: one that cannot be read carries error and no rows. At most 4
        queries at once (each distinct query once), 20s each, 20s for the whole read;
        answers are kept 30s per cache scope.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
        - $ref: '#/components/parameters/OpsEnvironment'
      responses:
        '200':
          description: The component's endpoints tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentTables'
        '400':
          description: Unknown env
        '404':
          description: Unknown component

  /v1/components/{id}/web:
    get:
      summary: One web table of a frontend's confirmed web bindings
      description: >-
        For each confirmed web.* binding in env whose recipe declares the table (pages,
        referrers, countries or devices: posthog-web, ga4-web, plausible-web,
        newrelic-browser's pages), that table, read and shared as for endpoints. A table
        whose value columns share one query keeps the order its source ranked the rows
        in (the most viewed first); the web kinds read the last 7 days unless the
        recipe's query says otherwise.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
        - $ref: '#/components/parameters/OpsEnvironment'
        - name: table
          in: query
          schema:
            type: string
            enum: [pages, referrers, countries, devices]
            default: pages
      responses:
        '200':
          description: The component's tables of that name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentTables'
        '400':
          description: Unknown env or table
        '404':
          description: Unknown component

  /v1/components/{id}/crashes:
    get:
      summary: The crashes and signatures tables of a mobile component's confirmed bindings
      description: >-
        For each confirmed mobile.* or errors.issues binding in env whose recipe
        declares tables.crashes (play-vitals, sentry-mobile) or tables.signatures
        (app-store-metrics), that table (crashes before signatures for one recipe),
        read and shared as for endpoints, in the order its source ranked the rows.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
        - $ref: '#/components/parameters/OpsEnvironment'
      responses:
        '200':
          description: The component's crashes and signatures tables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentTables'
        '400':
          description: Unknown env
        '404':
          description: Unknown component

  /v1/components/{id}/traces:
    get:
      summary: Search a component's traces through its traces.spans binding
      description: >-
        until defaults to now and since to an hour before; at most 7 days. The
        binding's TraceQL is run as a Tempo search (newest first); min_duration_ms
        keeps traces at least that long. An unbound component answers bound false
        and no traces; a binding that cannot be read answers error, never a failed
        request. Cut off after 20s (error code timeout).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
        - $ref: '#/components/parameters/OpsEnvironment'
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: min_duration_ms
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 86400000
        - name: limit
          in: query
          required: false
          description: 1–100, default 20.
          schema:
            type: integer
      responses:
        '200':
          description: The traces, or why the binding could not be read
          content:
            application/json:
              schema:
                type: object
                properties:
                  component_id:
                    type: string
                    format: uuid
                  environment:
                    type: string
                  bound:
                    type: boolean
                  data_source_id:
                    type: string
                    format: uuid
                    nullable: true
                  traces:
                    type: array
                    items:
                      $ref: '#/components/schemas/TraceSummary'
                  error:
                    type: object
                    nullable: true
                    properties:
                      code:
                        type: string
                        enum: [needs_params, unsupported, bad_query, upstream, timeout, not_found, error]
                      message:
                        type: string
        '400':
          description: Bad window, limit or min_duration_ms (fields), or unknown env
        '404':
          description: Unknown component

  /v1/components/{id}/traces/{traceId}:
    get:
      summary: One trace, read through the component's traces.spans binding
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalComponentID'
        - $ref: '#/components/parameters/OpsEnvironment'
        - name: traceId
          in: path
          required: true
          description: 1–32 hex digits, any case.
          schema:
            type: string
      responses:
        '200':
          description: The trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceView'
        '400':
          description: A trace id that is not hex, or an unknown env
        '404':
          description: Unknown component, or the source holds no such trace
        '422':
          description: The component has no confirmed traces.spans binding (code unbound)
        '502':
          description: The source failed (code upstream)
        '504':
          description: No answer within 20s (code timeout)

  /v1/operations/traces/{traceId}:
    get:
      summary: The Logs explorer's trace link
      description: >-
        With component_id, as GET /v1/components/{id}/traces/{traceId}. Without,
        the trace is looked up in each data source the environment's confirmed
        traces.spans bindings read (at most 8, in binding order), the first that
        holds it answering; 404 when none does, the last failure when one failed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OpsEnvironment'
        - name: traceId
          in: path
          required: true
          schema:
            type: string
        - name: component_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceView'
        '400':
          description: A malformed component_id or trace id, or an unknown env
        '404':
          description: Unknown component, or no source holds the trace
        '422':
          description: No traces.spans binding to read through (code unbound)
        '502':
          description: The source failed (code upstream)
        '504':
          description: No answer within 20s (code timeout)

  /v1/signal-bindings/{bindingId}/confirm:
    post:
      summary: Promote a suggestion to the confirmed binding of its signal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalBindingID'
      responses:
        '200':
          description: The confirmed binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignalBinding'
        '400':
          description: A recipe param still has no value (fields params.<name> required)
        '404':
          description: Unknown binding, or one another confirm of its slot replaced
        '409':
          description: Another write to the same slot won (code conflict); read and retry

  /v1/signal-bindings/{bindingId}/dismiss:
    post:
      summary: Dismiss a suggestion so the detector never offers it again
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalBindingID'
      responses:
        '204':
          description: Dismissed
        '404':
          description: Unknown binding
        '409':
          description: The binding is confirmed, even if only since it was listed (code confirmed); delete it instead

  /v1/signal-bindings/{bindingId}:
    delete:
      summary: Delete a binding or suggestion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SignalBindingID'
      responses:
        '204':
          description: Deleted
        '404':
          description: Unknown binding

  /v1/error-definitions:
    get:
      summary: Error definitions, newest first
      description: component_id answers that component's definitions and the repository-wide ones (migration 191).
      security:
        - bearerAuth: []
      parameters:
        - name: repository_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: component_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, suggested, dismissed]
      responses:
        '200':
          description: The definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  definitions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ErrorDefinition'
        '400':
          description: Malformed id, or unknown status (fields)
    post:
      summary: Create an error definition (source human, status active)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorDefinitionRequest'
      responses:
        '201':
          description: The definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDefinition'
        '400':
          description: Field errors (fields)

  /v1/error-definitions/suggest:
    post:
      summary: Have the release engineer propose error definitions
      description: >-
        Starts (or answers the running) AI job: one chat turn with the release
        engineer, which reads recent error groups (mode errors) or the code's own
        error types (mode code) and stores its proposals as suggested definitions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository_id]
              properties:
                repository_id:
                  type: string
                  format: uuid
                component_id:
                  type: string
                  format: uuid
                environment:
                  type: string
                  enum: [production, staging, preview, development]
                  default: production
                mode:
                  type: string
                  enum: [errors, code]
                  default: errors
      responses:
        '202':
          description: The job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIJobStarted'
        '400':
          description: Field errors (fields)
        '409':
          description: No release engineer for the area (code no_release_engineer)
        '503':
          description: No chat sessions on this server (code unavailable)

  /v1/error-definitions/{definitionId}:
    patch:
      summary: Edit an error definition
      description: Absent keeps; component_id "" makes it repository-wide; alert_threshold null clears it; match replaces the whole match.
      security:
        - bearerAuth: []
      parameters:
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorDefinitionRequest'
      responses:
        '200':
          description: The definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDefinition'
        '400':
          description: Field errors (fields); repository_id not_permitted
        '404':
          description: Unknown definition
    delete:
      summary: Delete an error definition
      security:
        - bearerAuth: []
      parameters:
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          description: Unknown definition

  /v1/error-definitions/{definitionId}/accept:
    post:
      summary: Accept a suggested definition (status active)
      security:
        - bearerAuth: []
      parameters:
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDefinition'
        '404':
          description: Unknown definition
        '409':
          description: Not a suggestion (code not_suggested)

  /v1/error-definitions/{definitionId}/dismiss:
    post:
      summary: Dismiss a suggested definition; its match is never suggested again
      security:
        - bearerAuth: []
      parameters:
        - name: definitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDefinition'
        '404':
          description: Unknown definition
        '409':
          description: Not a suggestion (code not_suggested)

  /v1/ai-jobs/{jobId}:
    get:
      summary: One release engineer suggestion job
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIJob'
        '404':
          description: Unknown job

  /v1/components/{componentId}/signals/ai-suggest:
    post:
      summary: Have the release engineer propose signal bindings and alert rules
      description: >-
        Starts (or answers the running) AI job that reads the data sources'
        inventories and proposes suggested bindings (source ai) for the
        component's unbound signals and disabled alert rules (created_by ai).
      security:
        - bearerAuth: []
      parameters:
        - name: componentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/OpsEnvironment'
      responses:
        '202':
          description: The job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIJobStarted'
        '400':
          description: Unknown env (fields)
        '404':
          description: Unknown component
        '409':
          description: No release engineer for the area (code no_release_engineer)

  /v1/components/{componentId}/observability:
    get:
      summary: What the component environment can be observed through, and what is missing
      security:
        - bearerAuth: []
      parameters:
        - name: componentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/OpsEnvironment'
      responses:
        '200':
          description: The readiness summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityReadiness'
        '400':
          description: Unknown env (fields)
        '404':
          description: Unknown component

  /v1/components/{componentId}/observability/enable:
    post:
      summary: Open the release engineer's "enable observability" task
      description: >-
        A technical task in todo on the component, assigned to the release
        engineer, whose brief has it define the instrumentation work and open
        the developer's task; it never edits code itself.
      security:
        - bearerAuth: []
      parameters:
        - name: componentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goals, target]
              properties:
                environment:
                  type: string
                  enum: [production, staging, preview, development]
                  default: production
                goals:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [metrics, traces, logs, rum, crash, queues]
                target:
                  type: string
                  enum: [own_cloud, self_hosted, otlp_endpoint]
                otlp_endpoint:
                  type: string
                  format: uri
                  description: Required with target otlp_endpoint, refused otherwise.
      responses:
        '201':
          description: The task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
                    format: uuid
                  task_key:
                    type: string
        '400':
          description: Field errors (fields)
        '404':
          description: Unknown component
        '409':
          description: No release engineer for the area (code no_release_engineer)
        '503':
          description: No board on this server (code unavailable)

  /v1/alert-rules:
    get:
      summary: Alert rules, by name
      security:
        - bearerAuth: []
      parameters:
        - name: component_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: env
          in: query
          required: false
          description: Absent means every environment.
          schema:
            type: string
            enum: [production, staging, preview, development]
      responses:
        '200':
          description: The rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertRule'
        '400':
          description: Malformed component_id or unknown env (fields)
    post:
      summary: Create an alert rule
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
      responses:
        '201':
          description: The rule, state ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Field errors (fields)

  /v1/alert-rules/backtest:
    post:
      summary: Replay a rule's condition over the last days
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AlertRuleRequest'
                - type: object
                  properties:
                    days:
                      type: integer
                      minimum: 1
                      maximum: 14
                      default: 7
      responses:
        '200':
          description: What would have fired
          content:
            application/json:
              schema:
                type: object
                properties:
                  fires:
                    type: array
                    items:
                      type: object
                      properties:
                        start:
                          type: string
                          format: date-time
                        end:
                          type: string
                          format: date-time
                          nullable: true
                          description: Null while still firing at the end of the range
                        peak:
                          type: number
                          nullable: true
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        points:
                          type: array
                          items:
                            $ref: '#/components/schemas/SeriesPoint'
                  step_seconds:
                    type: integer
        '400':
          description: Field errors (fields), or a query the source refused (code bad_query)
        '422':
          description: The signal has no confirmed binding (code unbound)
        '502':
          description: The data source failed (code upstream)

  /v1/alert-rules/suggest:
    post:
      summary: Starting rules for a component environment's bound signals (nothing is saved)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [component_id]
              properties:
                component_id:
                  type: string
                  format: uuid
                environment:
                  type: string
                  enum: [production, staging, preview, development]
      responses:
        '200':
          description: Suggested rules, without id or state
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertRuleSpec'
        '400':
          description: Malformed or unknown component_id, unknown environment (fields)

  /v1/alert-rules/{ruleId}:
    get:
      summary: One alert rule
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertRuleID'
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '404':
          description: Unknown rule
    patch:
      summary: Edit an alert rule; absent fields keep their value
      description: >-
        Changing what the rule reads or tests, open_incident or enabled
        restarts it from ok, resolving a firing rule first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertRuleID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
      responses:
        '200':
          description: The rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
        '400':
          description: Field errors (fields)
        '404':
          description: Unknown rule
    delete:
      summary: Delete an alert rule, resolving it first when firing
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertRuleID'
      responses:
        '204':
          description: Deleted
        '404':
          description: Unknown rule

  /v1/alert-rules/{ruleId}/events:
    get:
      summary: A rule's state changes, newest first
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AlertRuleID'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: The events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        at:
                          type: string
                          format: date-time
                        from_state:
                          $ref: '#/components/schemas/AlertState'
                        to_state:
                          $ref: '#/components/schemas/AlertState'
                        value:
                          type: number
                          nullable: true
                        incident_id:
                          type: string
                          format: uuid
                          nullable: true
        '400':
          description: Bad limit (fields)
        '404':
          description: Unknown rule

  /v1/notification-channels:
    get:
      summary: The channel kinds an alert rule may name, and which this server can deliver on
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every kind, available or not
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationChannelStatus'

  /v1/releases/{releaseId}/rollback-proposal/dismiss:
    post:
      summary: Dismiss the release engineer's proposed rollback
      description: >-
        Clears rollback_proposal; nothing in production changes, so no confirm phrase. A
        release without a proposal answers as it is. A rollback stays possible by hand
        while rollback_allowed says so.
      security:
        - bearerAuth: []
      parameters:
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The release, as GET /v1/releases/{id} answers it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseRollbackState'
        '400':
          description: Invalid release id
        '404':
          description: Unknown release

  /v1/releases/{releaseId}/impact:
    get:
      summary: What a release did to its component's golden signals in production
      description: >-
        For each golden signal of the component's role with a confirmed production binding,
        read at its p95 alone for a quantile signal and by its worst series where it answers
        several: the mean over [T-60m, T) (before), (T, T+60m] (after: the sample at T still
        straddles the deploy) and that after-window a day earlier (baseline), T being the
        release's deployed_at (finished_at for a release that never deployed on its own). A
        signal is worse or improved when it moved past deploy_ops.impact both from before and
        from the baseline, else neutral: change_pct of its before value (throughput_change_pct
        for a rate where higher is better), ratio_points for a ratio signal, and for a count
        an absolute floor too (count_floor for a gauge, rate_floor for a rate, at least
        floor_pct of the larger value; latency_floor_ms for a quantile in ms). unknown when it
        could not be read. verdict is the worst judged signal, unknown when none was. pending
        while T+60m is in the future (after and baseline cover what has passed). Fully read
        answers are kept for the minute.
      security:
        - bearerAuth: []
      parameters:
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The impact; verdict unknown and no signals when nothing is bound
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployImpact'
        '400':
          description: Invalid release id
        '404':
          description: Unknown release

  /health:
    get:
      summary: Server and LLM provider health
      description: >-
        Provider reachability is probed with a live model listing and the
        result is reused for up to 60s (15s after a failure); connecting,
        disconnecting or editing a provider or endpoint drops it.
      parameters:
        - name: fresh
          in: query
          required: false
          description: '"1" probes every provider now instead of reusing a recent result.'
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: Health report

  /v1/tasks:
    get:
      summary: Board tasks (released tasks older than the board window are left out)
      description: >-
        Every response carries a strong ETag (a hash of the body) and
        Cache-Control no-cache. A request whose If-None-Match matches the
        current body gets 304 with no body; the server answers that without
        reading the board while this process has written nothing the list shows,
        for at most 10 seconds, so a write by another host on the same database
        shows within that.
      security:
        - bearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The board
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/BoardTask'
                  count:
                    type: integer
        '304':
          description: The board is unchanged since the ETag in If-None-Match
          headers:
            ETag:
              schema:
                type: string

  /metrics:
    get:
      summary: Prometheus metrics

  /admin/reload:
    post:
      summary: Hot-reload config and MCP servers
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    OpsEnvironment:
      name: env
      in: query
      required: false
      description: The deploy environment kind; default production.
      schema:
        type: string
        enum: [production, staging, preview, development]
    OpsComponentID:
      name: component_id
      in: query
      required: false
      description: Repeated or comma-separated; limits the read to these components.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uuid
    SignalComponentID:
      name: id
      in: path
      required: true
      description: The component id.
      schema:
        type: string
        format: uuid
    SignalBindingID:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertRuleID:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AlertState:
      type: string
      enum: [ok, pending, firing, no_data]
    AlertCondition:
      type: object
      properties:
        op:
          type: string
          enum: [gt, lt, change_pct_gt, change_pct_lt, rising, no_data]
          description: >-
            rising holds while the value is above threshold and higher than a
            window earlier; the change ops compare the percent change from a
            window earlier; no_data holds while nothing is read.
        threshold:
          type: number
        for_seconds:
          type: integer
          minimum: 0
          maximum: 604800
        window_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 300
    AlertRuleSpec:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        component_id:
          type: string
          format: uuid
        environment:
          type: string
          enum: [production, staging, preview, development]
        signal:
          type: string
          description: A catalog signal, '' for a raw rule.
        data_source_id:
          type: string
          format: uuid
          nullable: true
          description: A raw rule's source; null for a signal rule.
        query:
          type: string
          description: A raw rule's query; '' for a signal rule.
        condition:
          $ref: '#/components/schemas/AlertCondition'
        severity:
          type: string
          enum: [critical, high, medium, low]
        channels:
          type: array
          description: >-
            Only kinds GET /v1/notification-channels answers available; another is the
            field error channels: unavailable (an unknown kind is invalid_option).
          items:
            type: string
            enum: [in_app, desktop, ios_push, slack, email, webhook]
        open_incident:
          type: boolean
        enabled:
          type: boolean
    NotificationChannelStatus:
      type: object
      required: [kind, available]
      properties:
        kind:
          type: string
          enum: [in_app, desktop, ios_push, slack, email, webhook]
        available:
          type: boolean
          description: This server registered the channel, so a rule may name it.
    RollbackProposal:
      type: object
      description: >-
        A rollback the release engineer asked for while the release's profile had
        auto_rollback off. Nothing ran; a human approves it (POST /v1/releases/{id}/rollback)
        or dismisses it. Cleared when a rollback runs, the release is superseded, a newer
        release of the component ships, or it is dismissed.
      required: [proposed_at, by, reason]
      properties:
        proposed_at:
          type: string
          format: date-time
        by:
          type: string
          enum: [agent]
        reason:
          type: string
          enum: [deploy_failed, verify_failed, health_incident]
        note:
          type: string
          description: What the release engineer observed.
        incident_id:
          type: string
          format: uuid
          description: The incident this release was attributed, when the proposal answers it (reason health_incident).
    ReleaseRollbackState:
      type: object
      description: >-
        Carried by every release JSON (list, get and every action's answer): the stored
        proposal, and what a rollback would answer right now, by the same rules
        POST /v1/releases/{id}/rollback applies.
      required: [rollback_proposal, rollback_allowed, rollback_refusal]
      properties:
        rollback_proposal:
          allOf:
            - $ref: '#/components/schemas/RollbackProposal'
          nullable: true
        rollback_allowed:
          type: boolean
        rollback_refusal:
          type: string
          enum: ['', newer_shipped, newer_open, not_deployed, too_old, no_released, unresolved, wrong_status]
          description: >-
            '' when allowed. newer_shipped: a newer release of the component is live;
            newer_open: a newer one is open; not_deployed: draft, pending or deploying;
            too_old: released more than 24 hours ago; no_released / unresolved: the
            component's newest released release is missing or could not be read;
            wrong_status: verifying, rolling_back, rolled_back or superseded.
    AlertRuleRequest:
      description: AlertRuleSpec's fields, each optional; absent keeps the rule's value (or the default on create).
      allOf:
        - $ref: '#/components/schemas/AlertRuleSpec'
    AlertRule:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
        - $ref: '#/components/schemas/AlertRuleSpec'
        - type: object
          properties:
            state:
              $ref: '#/components/schemas/AlertState'
            state_since:
              type: string
              format: date-time
            last_value:
              type: number
              nullable: true
            last_evaluated_at:
              type: string
