          type: string
        label:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum: [metrics, logs, traces, errors, crashes, rum, queues]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceField'
