openapi: 3.0.3
info:
  title: Local LLM Bridge API
  version: 1.0.0
  description: OpenAI-compatible bridge with agent loop, tools, sessions, jobs, and RAG.

paths:
  /v1/chat/completions:
    post:
      summary: Chat completions with agent loop
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                stream:
                  type: boolean
                session_id:
                  type: string
                tool_policy:
                  $ref: '#/components/schemas/ToolPolicy'
                file_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Completion response

  /v1/sessions:
    post:
      summary: Create session
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Session created

  /v1/sessions/{id}:
    get:
      summary: Get session with messages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      summary: Delete session
      security:
        - bearerAuth: []

  /v1/sessions/{id}/messages:
    post:
      summary: Send message to session
      security:
        - bearerAuth: []

  /v1/sessions/{id}/cancel:
    post:
      summary: Stop the agent turn this session has in flight
      description: >-
        Returns {"cancelled": true} when a live turn was stopped and
        {"cancelled": false} when there was nothing left to stop (the answer
        landed first) — the latter is a normal outcome, not an error.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string

  /v1/repositories/{id}/tasks/{taskId}/chat:
    post:
      summary: Open the chat thread about one board task
      description: >-
        Returns the session a human talks to an agent about this task in, plus
        the agent answering there. Idempotent — a task keeps one thread for its
        whole life, so this returns the existing session when there is one (and
        adopts the task's clarification thread rather than opening a second
        chat). The thread runs in the task's own branch checkout, not the shared
        mirror clone, so the agent can commit and push into the task's pull
        request. agent_id is "" when the task has no assignee and nobody is
        subscribed to its column. 404 for an unknown repository or a task that
        repository does not own; 503 on a build with no board.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The task's chat session
          content:
            application/json:
              schema:
                type: object
                required: [session_id, agent_id]
                properties:
                  session_id:
                    type: string
                    format: uuid
                  agent_id:
                    type: string
                    description: Agent uuid, or "" when the chat has no agent persona.

  /v1/jobs:
    post:
      summary: Create async job
      security:
        - bearerAuth: []

  /v1/jobs/{id}:
    get:
      summary: Get job status
      security:
        - bearerAuth: []
    delete:
      summary: Cancel or delete job
      security:
        - bearerAuth: []

  /v1/jobs/{id}/result:
    get:
      summary: Get completed job result
      security:
        - bearerAuth: []

  /v1/files:
    get:
      summary: List uploaded files
      security:
        - bearerAuth: []
    post:
      summary: Upload file for RAG
      security:
        - bearerAuth: []

  /v1/audit:
    get:
      summary: List audit log entries
      security:
        - bearerAuth: []

  /v1/tools/health:
    get:
      summary: MCP server health
      security:
        - bearerAuth: []

  /v1/repositories/{id}/alert-tokens:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create an alert ingest token for the repository
      description: >-
        The plaintext token is in this response only; the server keeps its
        sha256. default_env (local, stage, preprod or prod; prod when omitted)
        is the incident environment when neither the payload nor ?env= names one.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  maxLength: 100
                default_env:
                  type: string
                  enum: [local, stage, preprod, prod]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AlertIngestToken'
                  - type: object
                    properties:
                      token:
                        type: string
                      ingest_path:
                        type: string
                        example: /v1/alerts/ingest/tt_alert_…
        '400':
          description: Missing or over-long label, or an unknown default_env
        '404':
          description: No such repository
        '503':
          description: Alert tokens are not available on this server
    get:
      summary: List the repository's alert ingest tokens (never the token itself)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tokens, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertIngestToken'
        '503':
          description: Alert tokens are not available on this server

  /v1/repositories/{id}/alert-tokens/{tokenId}:
    delete:
      summary: Revoke one of the repository's alert ingest tokens
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked
        '404':
          description: No such token on this repository
        '503':
          description: Alert tokens are not available on this server

  /v1/alerts/ingest/{token}:
    post:
      summary: Ingest an alert with an alert ingest token instead of the API key
      description: >-
        The same normalization and ingest as POST /v1/repositories/{id}/incidents
        (Alertmanager, Sentry, GCP Cloud Monitoring, generic JSON), for the
        token's repository. A Content-Length (or a chunked body) over 256 KiB is
        refused. An unknown token is a bare 404. Each token has a request rate
        (prod_ops.alert_ingest.requests_per_minute, burst) and a cap on NEW
        incidents per rolling hour (new_incidents_per_hour); an alert that folds
        into an incident already open, and a recovery, are not refused by the
        cap.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: env
          in: query
          required: false
          description: Environment when the payload names none; overrides the token's default_env.
          schema:
            type: string
        - name: source
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  incident_id:
                    type: string
                    format: uuid
        '202':
          description: A recovery for an incident that is not open; nothing changed
        '400':
          description: The body is not JSON
        '404':
          description: Unknown token
        '413':
          description: Body over 256 KiB
        '429':
          description: The token is over its request rate, or over its hourly cap on new incidents
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [rate_limited]

  /v1/store/credentials/{provider}/apps:
    get:
      summary: List apps a saved store credential can see
      description: >-
        Picker source. Answers 200 with listing_available:false (never a
        5xx) when the store cannot enumerate apps for this credential — the
        Play Developer API has no listing endpoint at all, and a service
        account may not reach the separate Reporting API that does.
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [asc, google_play]
      responses:
        '200':
          description: App listing
          content:
            application/json:
              schema:
                type: object
                required: [listing_available, apps]
                properties:
                  listing_available:
                    type: boolean
                  apps:
                    type: array
                    items:
                      type: object
                      properties:
                        store_app_id:
                          type: string
                        identifier:
                          type: string
                        name:
                          type: string
                        state:
                          type: string

  /v1/repositories/{id}/store/apps/{platform}/link:
    put:
      summary: Bind a repository/platform to one store app
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [ios, android]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                store_app_id:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: The updated mobile store app row

  /v1/repositories/{id}/store/apps/{platform}/tracks:
    get:
      summary: Read the three store channels live
      description: >-
        Refreshes the app row's tracks cache with what App Store Connect /
        Google Play report right now for the internal, external and
        production channels.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [ios, android]
      responses:
        '200':
          description: StoreTracks

  /v1/repositories/{id}/store/apps/{platform}/promote:
    post:
      summary: Promote a store release one channel forward
      description: >-
        internal -> external -> production only, one step at a time.
        to=production requires a matching confirm phrase. 409 when the app
        is not yet ready for the move. Android into production takes
        user_fraction, the staged rollout's share in (0, 1] (left out: 1,
        everyone; 400 outside the range); App Store and the testing channels
        ignore it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [ios, android]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                to:
                  type: string
                confirm:
                  type: string
                user_fraction:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 1

  /v1/repositories/{id}/store/apps/android/rollout:
    post:
      summary: Change a Google Play production staged rollout
      description: >-
        user_fraction must be in (0, 1] — Play reads 0 as a completed
        release, so 0 is refused like anything outside the range (400).
        1 completes the rollout and requires confirm to match the
        repository's name (400 otherwise). 409 before the app is live.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_fraction]
              properties:
                user_fraction:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 1
                confirm:
                  type: string
      responses:
        '204':
          description: The rollout share was changed

  /v1/repositories/{id}/store/apps/{platform}/build:
    post:
      summary: Start a mobile store release build
      description: >-
        engine defaults to the repository's release_engine ("auto" = GitHub
        Actions, falling back to the paired machine). 409 when no engine can run
        it (domain.ErrNoReleaseEngine) — the task card is parked on
        human_decision rather than retried.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [ios, android]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                engine:
                  type: string
                  enum: [auto, github_actions, local]
      responses:
        '200':
          description: BuildStart
        '409':
          description: No release engine available

  /v1/roles:
    get:
      summary: List roles with their agent assignments and purposes
      security:
        - bearerAuth: []
    post:
      summary: Create a role
      description: key is immutable once created.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name]
              properties:
                key:
                  type: string
                name:
                  type: string
                description:
                  type: string
                required_tools:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: The created role

  /v1/roles/{id}:
    put:
      summary: Update a role's name/description/required_tools (key unchanged)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
    delete:
      summary: Delete a role
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /v1/roles/{id}/assignments:
    put:
      summary: Replace a role's agent assignments
      description: >-
        assignments: [{agent_id, areas, priority}]. When an assignment names
        an agent missing the role's required_tools, the request is refused
        with 422 {saved:false, missing_tools} unless confirm_grant_tools is
        set, in which case the missing tools are granted to that agent's
        policy and 200 {saved:true, role, granted_tools} is returned.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      agent_id:
                        type: string
                      areas:
                        type: array
                        items:
                          type: string
                        nullable: true
                      priority:
                        type: integer
                confirm_grant_tools:
                  type: boolean
      responses:
        '200':
          description: Saved
        '422':
          description: Missing required tools on one or more assigned agents

  /v1/agents/{agentId}/roles:
    get:
      summary: List the roles an agent holds
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
    put:
      summary: Replace every role membership this agent holds
      description: >-
        roles: [{role_id, areas}]. Same confirm_grant_tools/missing_tools
        contract as PUT /v1/roles/{id}/assignments, checked against the union
        of every named role's required_tools.
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved
        '422':
          description: Missing required tools

  /v1/role-purposes:
    get:
      summary: List the system-purpose to role mapping
      description: purposes = system_task_assignee, repo_profiler.
      security:
        - bearerAuth: []

  /v1/role-purposes/{purpose}:
    put:
      summary: Set (or clear, with role_id null) which role fulfils a purpose
      security:
        - bearerAuth: []
      parameters:
        - name: purpose
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_id:
                  type: string
                  nullable: true
      responses:
        '204':
          description: Saved

  /v1/task-types:
    get:
      summary: List task types
      security:
        - bearerAuth: []
    post:
      summary: Create a task type, optionally cloning another type's workflow stages
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, label, key_prefix]
              properties:
                key:
                  type: string
                label:
                  type: string
                key_prefix:
                  type: string
                  description: 1-4 uppercase letters, unique.
                clone_from:
                  type: string
      responses:
        '201':
          description: The created task type

  /v1/task-types/{key}:
    put:
      summary: Update a task type
      description: >-
        409 when key_prefix changes on a type that already has tasks (every
        existing task's key was rendered with the old prefix).
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The updated task type
        '409':
          description: key_prefix change refused (type has tasks)
    delete:
      summary: Delete a task type
      description: 409 when the type has tasks, or is the default type.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
        '409':
          description: Type has tasks, or is the default type

  /v1/task-types/{key}/workflow:
    get:
      summary: Read a task type's ordered workflow stages
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
    put:
      summary: Replace a task type's whole workflow stage set
      description: >-
        422 {error, problems:[{column_slug, field, message}]} on an unknown
        behaviour key, a behaviour attached at the wrong scope, an invalid
        param, or more than one worker/approver participant in a stage.
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The saved stage set
        '422':
          description: Validation problems

  /v1/workflows:
    get:
      summary: List every task type's full workflow (stages + behaviours)
      security:
        - bearerAuth: []

  /v1/workflow/behaviours:
    get:
      summary: The behaviour registry — every key, its scope, and its params
      description: >-
        Drives the workflow stage editor's behaviour picker and its
        validation. Also returns the fixed stage kinds and repo areas.
      security:
        - bearerAuth: []

  /v1/agents/{agentId}/subscriptions:
    get:
      summary: An agent's column subscriptions, with each column's task-type filter
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
    put:
      summary: Replace an agent's column subscriptions
      description: >-
        Accepts subscriptions:[{column_slug, task_types}] (task_types null or
        omitted = every type); the legacy column_slugs:[...] body is still
        accepted and saves each column with no filter.
      security:
        - bearerAuth: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Saved

  /v1/data-source-kinds:
    get:
      summary: Registered observability data source kinds and their config forms
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The kind registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataSourceKind'

  /v1/data-sources:
    get:
      summary: Configured data sources (never a secret value)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every data source
          content:
            application/json:
              schema:
                type: object
                properties:
                  data_sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataSource'
    post:
      summary: Add a data source, then verify it
      description: >-
        Saved first and verified after: 201 even when the source cannot be
        reached, with status error and status_detail saying why. A secret field
        sent in config is stored as a secret. An empty name defaults to the
        URL's host.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                name:
                  type: string
                config:
                  type: object
                  additionalProperties:
                    type: string
                secrets:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '201':
          description: Created; status reflects the verify run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400':
          description: The request does not fit the kind's schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceFieldErrors'

  /v1/data-sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: One data source
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The data source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '404':
          description: No such data source
    patch:
      summary: Change a data source, then verify it again
      description: >-
        A key given in config or secrets replaces its value and an empty string
        removes it; keys left out are kept. A field hidden by its show_when
        loses its value. Moving a url to another scheme, host or port needs
        every stored secret the result keeps re-sent in secrets (a new value,
        or "" to remove), else 400 with fields.secrets = secrets_required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                config:
                  type: object
                  additionalProperties:
                    type: string
                secrets:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        '200':
          description: Saved; status reflects the verify run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400':
          description: The result does not fit the kind's schema, or moves the URL without the secrets (secrets_required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceFieldErrors'
        '404':
          description: No such data source
    delete:
      summary: Remove a data source
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Removed
        '404':
          description: No such data source

  /v1/data-sources/{id}/verify:
    post:
      summary: Verify a data source again
      description: Always 200 for a known source; a failure is reported through status and status_detail.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The data source with the new status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'

  /v1/data-sources/{id}/discover:
    get:
      summary: Metric names the source holds, and the recipes they suggest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: match
          in: query
          required: false
          description: Case-insensitive substring filter on metric names. Recipe detection ignores it.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 1000
            maximum: 5000
      responses:
        '200':
          description: The inventory
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: array
                    items:
                      type: string
                  truncated:
                    type: boolean
                  recipes:
                    type: array
                    items:
                      type: object
                      properties:
                        recipe_id:
                          type: string
                        matched_metric:
                          type: string
        '422':
          description: The kind cannot list metrics (code unsupported)
        '502':
          description: The source failed (code upstream)

  /v1/data-sources/{id}/query:
    post:
      summary: Range query against a metrics data source
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, from, to]
              properties:
                query:
                  type: string
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                step_seconds:
                  type: number
                  description: 0 or omitted picks a step giving about 600 points (at least 15 s).
      responses:
        '200':
          description: The series
          content:
            application/json:
              schema:
                type: object
                properties:
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                        points:
                          type: array
                          description: '[unix_ms, value] pairs; value is null where the source answered NaN or ±Inf.'
                          items:
                            type: array
                            minItems: 2
                            maxItems: 2
                            items:
                              type: number
                              nullable: true
                  warnings:
                    type: array
                    items:
                      type: string
        '400':
          description: Bad range or step (fields), or a query the source refused (code bad_query)
        '422':
          description: The kind cannot query metrics (code unsupported)
        '502':
          description: The source failed (code upstream)

  /v1/signals:
    get:
      summary: The vendor-neutral signal catalog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every signal
          content:
            application/json:
              schema:
                type: object
                properties:
                  signals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Signal'

  /v1/recipes:
    get:
      summary: Recipes mapping signals to native queries (catalog plus user-added)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every recipe
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'

  /v1/operations/errors:
    get:
      summary: Error groups across every component of one deploy environment
      description: >-
        Reads every confirmed, bound environment of the kind (at most 50; truncated
        says more matched), 4 at a time, each cut off after 20s. An environment whose
        provider has no error surface is skipped silently; one that fails is listed
        in unavailable and never fails the answer. Sorted new first, then last_seen
        newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OpsEnvironment'
        - $ref: '#/components/parameters/OpsComponentID'
        - name: since
          in: query
          required: false
          description: RFC3339; default 24 hours ago, clamped to 30 days back.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The merged error groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsErrorGroup'
                  unavailable:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsUnavailable'
                  truncated:
                    type: boolean
        '400':
          description: Unknown env, malformed since or component_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatError'

  /v1/operations/logs:
    get:
      summary: Log entries across every component of one deploy environment
      description: >-
        Reads at most 10 confirmed, bound environments of the kind, 4 at a time,
        each cut off after 20s, with the same window and limit, and merges them
        newest first. More than 10 with no component_id is 400
        too_many_environments; with one, the first 10 are read and truncated is
        set. truncated is also set when an environment had more or the merge was
        cut. The next older page is the same query with until = the oldest
        timestamp returned (inclusive; de-duplicate entries at that instant).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OpsEnvironment'
        - $ref: '#/components/parameters/OpsComponentID'
        - name: since
          in: query
          required: false
          description: RFC3339; default an hour before until.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: RFC3339; default now.
          schema:
            type: string
            format: date-time
        - name: min_severity
          in: query
          required: false
          schema:
            type: string
            enum: [debug, info, warning, error, critical]
        - name: text
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Per environment and for the merge; default 200, max 500.
          schema:
            type: integer
      responses:
        '200':
          description: The merged entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsLogEntry'
                  unavailable:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpsUnavailable'
                  truncated:
                    type: boolean
        '400':
          description: >-
            Bad input, or too_many_environments (code too_many_environments, with
            matched and max_environments): pick components.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatError'

  /health:
    get:
      summary: Server and LLM provider health
      description: >-
        Provider reachability is probed with a live model listing and the
        result is reused for up to 60s (15s after a failure); connecting,
        disconnecting or editing a provider or endpoint drops it.
      parameters:
        - name: fresh
          in: query
          required: false
          description: '"1" probes every provider now instead of reusing a recent result.'
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: Health report

  /v1/tasks:
    get:
      summary: Board tasks (released tasks older than the board window are left out)
      description: >-
        Every response carries a strong ETag (a hash of the body) and
        Cache-Control no-cache. A request whose If-None-Match matches the
        current body gets 304 with no body; the server answers that without
        reading the board while this process has written nothing the list shows,
        for at most 10 seconds, so a write by another host on the same database
        shows within that.
      security:
        - bearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The board
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/BoardTask'
                  count:
                    type: integer
        '304':
          description: The board is unchanged since the ETag in If-None-Match
          headers:
            ETag:
              schema:
                type: string

  /metrics:
    get:
      summary: Prometheus metrics

  /admin/reload:
    post:
      summary: Hot-reload config and MCP servers
      security:
        - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    OpsEnvironment:
      name: env
      in: query
      required: false
      description: The deploy environment kind; default production.
      schema:
        type: string
        enum: [production, staging, preview, development]
    OpsComponentID:
      name: component_id
      in: query
      required: false
      description: Repeated or comma-separated; limits the read to these components.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uuid
  schemas:
    FlatError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        matched:
          type: integer
          description: too_many_environments only
        max_environments:
          type: integer
          description: too_many_environments only
    OpsUnavailable:
      type: object
      properties:
        component_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        code:
          type: string
          enum: [not_connected, cloud_auth, provider_error, timeout]
        message:
          type: string
    OpsErrorGroup:
      type: object
      properties:
        component_id:
          type: string
          format: uuid
        repository_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [vercel, gcp, aws]
        fingerprint:
          type: string
        message:
          type: string
        count:
          type: integer
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        sample:
          type: string
        source:
          type: string
        new:
          type: boolean
          description: The group's first occurrence falls inside the window.
        external_url:
          type: string
    OpsLogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
          enum: [debug, info, warning, error, critical]
        message:
          type: string
        source:
          type: string
        method:
          type: string
        path:
          type: string
        status_code:
          type: integer
        trace_id:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        component_id:
          type: string
          format: uuid
        environment_id:
          type: string
          format: uuid
    AlertIngestToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        default_env:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: When an alert was last accepted with this token
    ToolPolicy:
      type: object
      properties:
        allow_mcp_servers:
          type: array
          items:
            type: string
        allow_tools:
          type: array
          items:
            type: string
    BoardTask:
      type: object
      description: >-
        A board task. Only the fields most clients key on are listed; the
        payload carries more and clients must ignore fields they do not know.
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        repository_id:
          type: string
          format: uuid
        key:
          type: string
        title:
          type: string
        column:
          type: string
        column_entered_at:
          type: string
          format: date-time
        latest_pipeline_status:
          type: string
        agent_running:
          type: boolean
          description: >-
            True while one of the task's agent runs is in status running, so a
            board can poll a task's activity only while it is moving.
    DataSourceField:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        help:
          type: string
        type:
          type: string
          enum: [text, url, secret, select, headers]
        required:
          type: boolean
          description: Applies only while the field is shown.
        options:
          type: array
          items:
            type: string
        placeholder:
          type: string
        show_when:
          type: object
          description: The field is shown only while every named field holds the given value.
          additionalProperties:
            type: string
        secret:
          type: boolean
          description: Send it in secrets; it never comes back, only its key in secrets_set.
    DataSourceKind:
      type: object
      properties:
        kind:
          type: string
        label:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum: [metrics, logs, traces, errors, crashes, rum, queues]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceField'
    DataSource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
        secrets_set:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ok, error, unverified]
        status_detail:
          type: string
        info:
          type: object
          properties:
            version:
              type: string
            detail:
              type: string
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: The last successful verify.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            type: string
    DataSourceFieldErrors:
      type: object
      properties:
        error:
          type: string
        fields:
          type: object
          description: >-
            Key (a config or secret field, kind, name, secrets, query, from,
            to, step_seconds, limit) to one of required, invalid,
            not_permitted, unknown_field, invalid_option, too_long,
            secrets_required. secrets_required (key secrets) is a PATCH
            moving a url to another scheme, host or port without re-sending
            every stored secret it keeps (a new value, or "" to remove).
          additionalProperties:
            type: string
    Signal:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [metric, log, trace, error]
        unit:
          type: string
        roles:
          type: array
          items:
            type: string
        aggregation:
          type: string
          enum: [rate, ratio, quantile, gauge]
    Recipe:
      type: object
      properties:
        id:
          type: string
        source_kind:
          type: string
        applies_to:
          type: object
          properties:
            technology:
              type: string
            messaging_system:
              type: string
        detect:
          type: object
          properties:
            metric:
              type: string
        params:
          type: array
          items:
            type: string
        signals:
          type: object
          description: Signal id to native query; $param, $__rate and $__interval are placeholders.
          additionalProperties:
            type: string
        origin:
          type: string
          enum: [catalog, user]
