          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
        secrets_set:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [ok, error, unverified]
        status_detail:
          type: string
        info:
          type: object
          properties:
            version:
              type: string
            detail:
              type: string
        verified_at:
          type: string
          format: date-time
          nullable: true
          description: The last successful verify.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        capabilities:
          type: array
          items:
            type: string
    DataSourceFieldErrors:
      type: object
      properties:
        error:
          type: string
        fields:
          type: object
          description: >-
            Key (a config or secret field, kind, name, secrets, query, from,
            to, step_seconds, limit) to one of required, invalid,
            not_permitted, unknown_field, invalid_option, too_long,
            secrets_required, not_found, wrong_provider. not_found and
            wrong_provider are a cloud_account field naming no connected
            account, or another provider's, or a store_credential field
            naming a store credential not saved, or the other store's.
            secrets_required (key secrets) is a PATCH
            moving a url to another scheme, host or port (or kafka's
            bootstrap_servers to another set of hosts) without re-sending
            every stored secret it keeps (a new value, or "" to remove).
            kafka's bootstrap_servers is a comma-separated host[:port] list:
            invalid when malformed, not_permitted when a host is a refused
            literal or name (cloud metadata).
          additionalProperties:
            type: string
    Signal:
      type: object
