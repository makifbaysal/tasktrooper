llm:
  base_url: ""
  model: ""
  api_key: ""
  max_iterations: 30
  task_max_iterations: 80
  # Covers one whole non-streamed response: a turn that hit its output cap is
  # retried with up to twice the cap (32K tokens), which outruns 300s.
  timeout: "600s"

server:
  port: 8085
  api_key: "${SERVER_API_KEY}"
  public_base_url: "${PUBLIC_BASE_URL}"

storage:
  postgres:
    dsn: "${POSTGRES_DSN}"
    max_conns: 10
  sessions:
    ttl: "24h"
    workspace_root: "./data/workspaces"

jobs:
  max_concurrent: 3
  timeout: "10m"

rag:
  enabled: true
  storage_dir: "./data/files"
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 5

orchestration:
  enabled: true
  fast_path: true
  max_parallel_tasks: 3
  max_plan_tasks: 10
  skill_retrieval_top_k: 5
  subtask_history_mode: isolated
  dependency_output_max_chars: 4000
  synthesis_enabled: false
  verification_enabled: true
  max_replan_iterations: 2

prod_ops:
  monitor_enabled: true
  # Two failed probes in a row open an incident, so an outage is caught within
  # two intervals (six minutes), inside deploy_ops.health_window. Shorter costs
  # an HTTP probe per target, and a query, on an otherwise idle machine.
  probe_interval: "3m"
  # Per alert ingest token (POST /v1/alerts/ingest/:token), so a leaked token
  # cannot open incidents, tasks and agent runs without bound. Over either
  # limit the request gets 429; an alert that folds into an incident already
  # open, and a recovery, are never refused by the hourly cap. 0 = default.
  alert_ingest:
    requests_per_minute: 60
    burst: 10
    new_incidents_per_hour: 20

# The deploy monitor mirrors GitHub Actions deploy runs into deployment_runs,
# attributes console-triggered dispatches, and opens an incident for a failed
# deploy.
#
# It had no block here at all, which meant monitor_enabled defaulted to false
# and the table it fills was only ever written by a console dispatch. That is
# now wrong in a way it was not before: deployment_runs is what the release
# rollback reads to find the last known-good commit, and what the post-release
# health window reads to decide which task's release production is running. With
# the monitor off, both fall back to "no evidence" — the rollback refuses for
# want of a target and the attribution declines to blame anyone.
#
# The cost is bounded and small: one GitHub API call per (repository ×
# environment) that has BOTH a deploy target and a mapped deploy workflow, every
# poll_interval. A repository with no deploy target is not polled at all.
deploy_ops:
  monitor_enabled: true
  poll_interval: "2m"
  # How long after a successful deploy an incident on that environment is
  # attributed to the task that just released — and, where auto_rollback is on,
  # rolled back. Short on purpose: it authorises undoing a specific card's
  # release, so a coincidence must not reach it.
  health_window: "15m"
  # Deploy impact: how far a golden signal must move across a deploy (the
  # hour before against the hour after, and the same hour a day earlier) to
  # read as improved or worse — percent of its value before (throughput,
  # which swings more, by throughput_change_pct), or percentage points for a
  # ratio signal such as an error rate. A count must also move by an absolute
  # floor (count_floor for a gauge such as a backlog, rate_floor per second
  # for an error rate), at least floor_pct percent of the larger value; a
  # latency in ms by latency_floor_ms, which also floors a soak's
  # max_p95_delta_pct.
  impact:
    change_pct: 10
    ratio_points: 0.5
    throughput_change_pct: 25
    count_floor: 1
    rate_floor: 0.05
    floor_pct: 5
    latency_floor_ms: 50

# The alert rule evaluator: each enabled rule is read and judged once per
# interval (one query against its data source), at most max_rules_per_sweep a
# sweep, four at a time. A sweep runs every quarter interval, so a rule is
# judged at most a quarter interval late.
alerting:
  enabled: true
  interval: "1m"
  max_rules_per_sweep: 200

storeops:
  poll_interval: "5m"

board:
  dispatch_enabled: true
  verification_enabled: true
  verify_max_fix_attempts: 2
  require_criteria_complete: true
  reconcile_stale_after: "30m"
  reconcile_interval: "5m"
  # How long a task may wait in code_review for a build/test result before its
  # reviewer is dispatched anyway, and how often unfinished pipelines are
  # re-asked. The timeout must stay above the pipeline runner's own 30m poll,
  # or a live pipeline would be given up on before it could answer.
  pipeline_gate_timeout: "45m"
  pipeline_gate_interval: "2m"

# Each run's context window, output cap and summarize threshold come from the
# model it runs on (application/context/limits.go): e.g. 1M window / 16K turn
# cap for current Claude Opus/Sonnet, 128K / 16K for gpt-4o, 32K / 4K for a
# local endpoint or an unrecognised model. A threshold left at 0 is 45% of the
# window. Set any of the three to a positive number to override every model.
context:
  max_tokens: 0
  reserve_output: 0
  summarize_threshold: 0
  keep_recent_messages: 10

mapping:
  enabled: true
  tree_max_depth: 4
  max_files: 500
  skeleton_max_tokens: 3000
  inject_on_session_start: true

indexer:
  enabled: true
  top_k: 5
  reindex_on_change: true
  chunk_max_lines: 150
  # Extra roots a repository or a session may be pointed at, ON TOP OF the
  # calling tenant's own subtree of workspace_root, which is always allowed.
  # Empty means nothing extra — not "anywhere", which is what it used to mean
  # and what made /v1/repositories/open able to index any directory on the pod.
  # Set it only on a self-hosted install that keeps checkouts elsewhere.
  allowed_roots: []
  query_rewrite: true
  # true also indexes generated code and mocks (mockery, protoc, *_gen.go, ...).
  # .tasktrooperignore at the repository root is honoured either way.
  index_generated: false
  concurrency: 1

embedding:
  # 0 = unthrottled. The desktop embeds on this machine, where a fixed pace only
  # adds waiting: 20 a minute held every index to one chunk per three seconds
  # (a 1,200-chunk repository took over an hour) and made each code search wait
  # too. A hosted provider that answers 429 is still slowed down by the retries
  # below; set a number here only for one that needs a steady pace.
  requests_per_minute: 0
  max_retries: 8
  retry_backoff: 2s
  max_retry_wait: 60s
  request_timeout: 60s
  query_cache_entries: 2048

graph:
  enabled: true
  max_expansion_depth: 2
  max_expanded_chunks: 8

tools:
  default_policy:
    allow_tools: ["ask_user", "web_search", "fetch_url", "codebase_search", "grep_code", "get_repo_tree", "get_symbol_skeleton", "expand_symbol_context", "search_boilerplate_catalog", "read_file", "get_project_brief", "list_component_checks", "list_links"]
  max_tool_output_chars: 16000
  search:
    enabled: true
    max_results: 5
  terminal:
    enabled: true
    working_dir: "./data/workspaces"
    timeout: "3m"
    max_timeout: "15m"
    sandbox:
      mode: blocklist
      allowed_commands: ["ls", "cat", "grep", "curl", "echo", "pwd", "find", "head", "tail", "mkdir", "touch", "go", "tee", "cd", "cp", "mv", "wc"]
      blocked_patterns: ["rm -rf", "sudo", "chmod", "mkfs", "> /dev", "dd if=", "shutdown", "reboot", "| sh", "|sh", "| bash", "|bash", "gh pr merge"]
      restrict_working_dir: true
  web:
    enabled: true
    max_response_bytes: 1048576

  browser:
    enabled: true

  mobile:
    hub_url: "${MOBILE_APPIUM_HUB_URL}"
    appium_bin: "${APPIUM_BIN}"
    device_udid: "${MOBILE_DEVICE_UDID}"
    platform_version: "${MOBILE_PLATFORM_VERSION}"
    device_pin: "${MOBILE_DEVICE_PIN}"
    auth_token: "${MOBILE_APPIUM_TOKEN}"
    bridge_url: "${MOBILE_BRIDGE_URL}"
    bridge_token: "${MOBILE_BRIDGE_TOKEN}"
  boilerplate_catalog:
    enabled: true

# Local Claude Code CLI executor. Agents on the claude_code provider are run by
# this binary instead of by the HTTP agent loop; an installation where it is not
# on PATH registers no executor and those agents' runs fail with one clear
# sentence saying so. max_turns / run_timeout / max_concurrent_sessions are left
# unset: the executor owns those defaults (100 turns, 1h per session, no
# session cap of its own).
claude_code:
  binary: "${CLAUDE_CODE_BIN}"
  # A host-wide cap on CLI sessions running at once, on top of the Settings
  # concurrency limits. Unset (or 0) means none: the limits set in Settings
  # are the only ones, and 0 there is unlimited.
  # max_concurrent_sessions: 3
  # Which of the CLI's settings files a session loads. Unset means
  # "project,local": the operator's own ~/.claude hooks and plugins stay out of
  # a board run. Set "user,project,local" only if this host authenticates the
  # CLI through a user-level apiKeyHelper.
  # setting_sources: "project,local"

evolution:
  enabled: true
  allow_web_research: true
  tick_interval: "10m"
  reflect_interval: "24h"
  revision_debounce: "30m"
  impact_window: "168h"
  golden_gate: true        # skill/kural degisiklikleri yazilmadan once prova edilir; yalnizca daha iyi sonuc veren benimsenir
  probe_cases: 2           # golden gorevlere ek olarak prova edilen son gercek istek sayisi
  max_always_on_chars: 8000 # ajanin etkin kurallarinin toplam karakter siniri
  reflection_timeout: "30m"
  max_skills_per_agent: 100 # ajan basina toplam skill butcesi (dolunca create reddedilir)
  max_rules_per_agent: 15
  # model: ""          # reflection + prova icin model override
  # provider_type: ""
  # judge_model: ""    # provalari kor olarak puanlayan ayri model
  # judge_provider_type: ""
  # Bos birakilirsa reflection ve judge, ajanin zor isler icin ayarlanan
  # model_heavy'si ile calisir (model_heavy da bossa ajanin normal modeli).

# External agents & skills catalog. Disabled until source is set: source is
# either a git URL (fetched into cache_dir at every sync) or a local directory
# (used in place, cache_dir ignored). Sync runs at boot, on the interval below,
# and from the manual button in the UI's Catalog page. Two per-agent toggles
# decide what the sync may apply automatically:
#   auto_pull_agent_updates - overwrite the agent's own prompt/roles/etc from
#                             the catalog (off = "I hand-edited this agent")
#   keep_skills_updated     - LLM-merge when a skill changed BOTH upstream and
#                             locally ("guncel tut")
# New upstream agents and new upstream skills are always applied; deletion is
# gated on keep_skills_updated.
agent_catalog:
  source: "${AGENT_CATALOG_REPO}"
  cache_dir: "./data/catalog"
  interval: "15m"

# The other agent CLIs. An empty binary resolves on PATH.
antigravity:
  binary: "${ANTIGRAVITY_BIN}"
cursor_agent:
  binary: "${CURSOR_AGENT_BIN}"
opencode:
  binary: "${OPENCODE_BIN}"
