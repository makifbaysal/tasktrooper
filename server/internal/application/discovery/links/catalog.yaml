# Dependency catalog: manifest package name -> the resource it wires the
# component to. Data, not code — extend by adding an entry, not a branch.
# match.go is a prefix; every other ecosystem list is exact unless the entry
# ends in "*", which is a prefix on that ecosystem too (e.g. @sentry/*).
- id: postgres
  match:
    npm: [pg, postgres, "@neondatabase/serverless"]
    go: [github.com/jackc/pgx, github.com/lib/pq]
    py: [psycopg, psycopg2, asyncpg]
    rust: [tokio-postgres, postgres]
    ruby: [pg]
    jvm: ["org.postgresql:postgresql"]
  resource: { kind: database, vendor: postgres, name: PostgreSQL }
  protocol: sql
  scope: repo

- id: mysql
  match:
    npm: [mysql, mysql2]
    go: [github.com/go-sql-driver/mysql]
    py: [pymysql, mysqlclient, PyMySQL]
    rust: [mysql, mysql_async]
    ruby: [mysql2]
    jvm: ["mysql:mysql-connector-java"]
  resource: { kind: database, vendor: mysql, name: MySQL }
  protocol: sql
  scope: repo

- id: mongodb
  match:
    npm: [mongodb, mongoose]
    go: [go.mongodb.org/mongo-driver]
    py: [pymongo]
    rust: [mongodb]
    ruby: [mongo]
  resource: { kind: database, vendor: mongodb, name: MongoDB }
  protocol: other
  scope: repo

- id: redis
  match:
    npm: [redis, ioredis]
    go: [github.com/redis/go-redis, github.com/go-redis/redis]
    py: [redis]
    rust: [redis]
    ruby: [redis]
    jvm: ["redis.clients:jedis"]
  resource: { kind: cache, vendor: redis, name: Redis }
  protocol: redis
  scope: repo

- id: elasticsearch
  match:
    npm: ["@elastic/elasticsearch"]
    go: [github.com/elastic/go-elasticsearch]
    py: [elasticsearch]
  resource: { kind: search, vendor: elasticsearch, name: Elasticsearch }
  protocol: sdk
  scope: repo

- id: opensearch
  match:
    npm: ["@opensearch-project/opensearch"]
    go: [github.com/opensearch-project/opensearch-go]
    py: [opensearch-py]
  resource: { kind: search, vendor: opensearch, name: OpenSearch }
  protocol: sdk
  scope: repo

# A queue resource's vendor is the messaging system the Operations console
# matches recipes and broker sources against (kafka, rabbitmq, nats, sqs,
# pubsub, servicebus, redis): keep it the same across entries for one broker.
# The console ranks the recipes of a worker's own brokers first rather than
# hiding the others, so a library missing here costs order, not offers.
- id: kafka
  match:
    npm: [kafkajs, "@confluentinc/kafka-javascript", node-rdkafka]
    go: [github.com/segmentio/kafka-go, github.com/IBM/sarama, github.com/Shopify/sarama, github.com/twmb/franz-go, github.com/confluentinc/confluent-kafka-go]
    py: [confluent-kafka, kafka-python, aiokafka, faust, faust-streaming]
    rust: [rdkafka]
    ruby: [ruby-kafka, rdkafka, karafka]
    jvm:
      - "org.springframework.kafka:spring-kafka"
      - "org.apache.kafka:kafka-clients"
      - "org.apache.kafka:kafka-streams"
      - "org.springframework.cloud:spring-cloud-stream-binder-kafka"
      - "org.springframework.cloud:spring-cloud-stream-binder-kafka-streams"
      - "io.quarkus:quarkus-smallrye-reactive-messaging-kafka"
      - "io.quarkus:quarkus-messaging-kafka"
      - "io.smallrye.reactive:smallrye-reactive-messaging-kafka"
    nuget: [Confluent.Kafka]
  resource: { kind: queue, vendor: kafka, name: Kafka }
  protocol: queue
  scope: repo

- id: rabbitmq
  match:
    npm: [amqplib, amqp-connection-manager]
    go: [github.com/rabbitmq/amqp091-go, github.com/streadway/amqp]
    py: [pika, aio-pika]
    rust: [lapin]
    ruby: [bunny]
    jvm:
      - "org.springframework.amqp:spring-rabbit"
      - "org.springframework.boot:spring-boot-starter-amqp"
      - "com.rabbitmq:amqp-client"
      - "org.springframework.cloud:spring-cloud-stream-binder-rabbit"
      - "io.quarkus:quarkus-smallrye-reactive-messaging-rabbitmq"
      - "io.quarkus:quarkus-messaging-rabbitmq"
    nuget: [RabbitMQ.Client]
  resource: { kind: queue, vendor: rabbitmq, name: RabbitMQ }
  protocol: queue
  scope: repo

