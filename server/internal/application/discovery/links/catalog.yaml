# Job queues that only run on Redis. Celery is left out: its broker is as
# often RabbitMQ, which its manifest does not say.
- id: bullmq
  match:
    npm: [bullmq, bull, bee-queue]
    go: [github.com/hibiken/asynq]
    py: [rq]
    ruby: [sidekiq, resque]
    php: [laravel/horizon]
  resource: { kind: queue, vendor: redis, name: Redis }
  protocol: queue
  scope: repo
