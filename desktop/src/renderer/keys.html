<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The API-key window's CSP: the chrome's, with nothing loosened. The page
      talks to the main process over its preload and to nothing else.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none'"
    />
    <title>API keys — TaskTrooper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/keys/main.tsx"></script>
  </body>
</html>
