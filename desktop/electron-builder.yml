# Packaging.
#
# There are two ways this config gets used, and only one of them is the real
# one:
#
#   Signed + notarized (the shipping build). `mac.identity` is deliberately NOT
#   set, so electron-builder searches the keychain. In CI, CSC_LINK /
#   CSC_KEY_PASSWORD make it import the Developer ID certificate into a
#   throwaway keychain first. `notarize: true` then submits the .app to Apple
#   with the App Store Connect API key in APPLE_API_KEY / APPLE_API_KEY_ID /
#   APPLE_API_ISSUER and staples the ticket before the dmg and zip are made.
#
#   Ad-hoc (the fallback, for a fork or a checkout with no signing material).
#   Pass `-c.mac.identity=-`, which is electron-builder's explicit opt-in to
#   ad-hoc signing. This is not the same as "unsigned": an arm64 Mach-O with no
#   signature at all cannot be executed on Apple Silicon, so a genuinely
#   unsigned build is a build that cannot launch. Ad-hoc plus
#   `xattr -dr com.apple.quarantine` launches.
#
# Never set `identity: null`. That is the third state — skip signing entirely —
# and it is the one that produces "TaskTrooper is damaged and can't be opened".
appId: ai.tasktrooper.desktop
productName: TaskTrooper
copyright: TaskTrooper

# No update feed, and that is a fix rather than a default.
#
# electron-builder does NOT leave `app-update.yml` out of the bundle when
# `publish` is absent — it *infers* a configuration from the git remote and
# writes that, so every build would carry a `provider: github` feed nobody
# chose. `null` is electron-builder's explicit "no publishing", and it stops the
# inference. A build that should update itself is packaged with a generic
# publish configuration passed on the command line; `services/updater.ts` reads
# `provider: generic` and refuses anything else.
publish: null

directories:
  output: release
  buildResources: build

# The built artefacts and nothing else. node_modules is not shipped: main and
# the preloads are bundled by esbuild, and the shell's chrome by Vite.
files:
  - dist/**/*
  - package.json
  - "!ui/**/*"

extraResources:
  # The Go backend, built by `npm run build:server:universal`. It lands in
  # Contents/Resources/bin, which is where services/detect.ts looks in a
  # packaged app and what codesigning covers.
  - from: bin
    to: bin
    filter:
      - "**/*"
  # The product itself. Everything the user sees is in here, served from
  # app://tasktrooper by main/services/app-scheme.ts instead of fetched over the
  # network — which is what makes the window open on a rendered screen rather
  # than a spinner. `to: web` is the same name webRoot() resolves in a packaged
  # copy; the two have to agree or the window comes up empty.
  - from: ui/dist
    to: web
    filter:
      - "**/*"
  # The role agents: the six-agent catalog the backend syncs at boot
  # (server/resources/config.yml: agent_catalog.source), handed to it as
  # AGENT_CATALOG_REPO via services/app-scheme.ts catalogRoot(). It sits next
  # to the server's own binary so the two halves of the product travel
  # together. `to: catalog` is the same name catalogRoot() resolves in a
  # packaged copy; the two have to agree or boot reports an unreadable catalog
  # and no role agents are created.
  - from: ../catalog
    to: catalog
    filter:
      - "**/*"
  # The embedder: its JS bundle plus onnxruntime-web's staged .wasm/.mjs runtime
  # files, built by `npm run build:embedder` into this package's own dist/ — no
  # model weights here, those download into userData at runtime. A flat
  # directory, not a node_modules tree, which is exactly why engine.ts points
  # `ort.env.wasm.wasmPaths` at it explicitly rather than relying on relative
  # auto-resolution. `to: embedder` is the same name embedderScriptPath()
  # resolves in a packaged copy (services/detect.ts).
  - from: dist/embedder
    to: embedder
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  # Universal, because the bundled backend is universal: an app that runs under
  # Rosetta while its Go child is arm64 is a support case nobody can reproduce.
  target:
    - target: default
      arch:
        - universal
  # Required for notarization, and the reason both entitlement files exist. It
  # stays on for the ad-hoc build too — which is only survivable because
  # disable-library-validation is in the entitlements; see the plists.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # The Go binary under Resources/bin has to be signed in its own right — the
  # .app's signature does not cover it, and notarization rejects an app
  # containing an unsigned Mach-O.
  #
  # These paths are relative to the .app bundle, NOT to this package.
  # electron-builder resolves each entry against the CWD first and only falls
  # back to the bundle, so a bare `bin/agent-server` would match the staging
  # copy in ./bin — which is signed long after it was already copied into the
  # app, and therefore signs nothing that ships.
  #
  # Adding a line for a binary that is not staged fails the whole build at the
  # signing step, ten minutes in, with "No such file or directory" — every one
  # here is built by `npm run package`.
  binaries:
    - Contents/Resources/bin/agent-server
    - Contents/Resources/bin/executor
    - Contents/Resources/bin/runner
  # Submits the signed .app to Apple and staples the ticket, using whichever of
  # APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER (preferred) or
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID is present in the
  # environment. With none of them set, electron-builder logs "notarize options
  # were unable to be generated" and carries on — which is exactly what the
  # ad-hoc fallback wants, and why this can stay `true` unconditionally.
  #
  # This key belongs under `mac:`, not at the root. electron-builder 26
  # validates its config against a schema and rejects an unknown root property
  # outright, so a root-level `notarize` makes every invocation exit 1 before it
  # packs anything.
  notarize: true
  extendInfo:
    # A menu-bar app that keeps running with no window. Without this, closing
    # the window would look like quitting.
    LSUIElement: false
    NSHumanReadableCopyright: TaskTrooper

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # electron-builder does not sign the disk image by default — it signs the .app
  # inside and leaves the container bare. That is enough for notarization, which
  # inspects the contents; but Gatekeeper assesses the image the user actually
  # double-clicks, and an unsigned image is "rejected: no usable signature"
  # however good the app inside it is.
  sign: true

# Windows and Linux are built on their own runners (the backend is cgo), and
# neither is code-signed yet.
win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  maintainer: Mehmet Akif Baysal <makifbaysal@users.noreply.github.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

# The AppImage runtime. The default ("0.0.0") is the legacy FUSE 2 runtime,
# which needs libfuse.so.2 — not installed on a stock Ubuntu 22.04 or 24.04, so
# the AppImage would not start there at all. 1.0.3 is the static runtime, which
# carries its own FUSE 3 support, and whose AppRun adds --no-sandbox itself
# only when unprivileged user namespaces are unavailable (Ubuntu 24.04's
# AppArmor default) instead of on every launch. electron-builder 26 (the
# version in package-lock) validates this key; a value it does not list fails
# the build at config load.
toolsets:
  appimage: "1.0.3"

deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
